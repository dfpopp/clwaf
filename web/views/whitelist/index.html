<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>白名单</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <link rel="stylesheet" href="../../static/css/table.css">
  <style>
    /* ============================================================
       白名单页面样式（1:1 对齐 UI/whitelist）
       ============================================================ */
    html, body { height: 100%; }
    #app { height: 100%; }
    .page-container { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; background: var(--content-gradient), var(--bg-body); }
    .page-container::-webkit-scrollbar { width: 6px; }
    .page-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* ===== 统计卡片 ===== */
    .stats-row { margin-bottom: 16px; }
    .stats-row .el-col { margin-bottom: 0; }
    .mini-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; height: 100%; box-sizing: border-box; }
    .mini-stat .ms-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .mini-stat .ms-label { font-size: 12px; color: var(--text-secondary); }
    .mini-stat .ms-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .icon-blue { background: var(--accent-soft); color: var(--accent); }
    .icon-green { background: rgba(34,197,94,0.12); color: var(--success); }
    .icon-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .icon-orange { background: rgba(245,158,11,0.12); color: var(--warning); }

    /* ===== 筛选栏（裸 filter-bar + tabs，同 UI） ===== */
    .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: nowrap; }
    .filter-left { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; }
    .filter-label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .filter-label i { color: var(--accent); line-height: 1; }
    .tabs { display: flex; gap: 4px; background: var(--bg-body); padding: 3px; border-radius: 8px; }
    .tabs .tab { padding: 5px 14px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); cursor: pointer; background: none; border: none; font-family: var(--font); transition: all 0.15s; }
    .tabs .tab:hover { color: var(--text-primary); }
    .tabs .tab.active { background: var(--accent); color: #fff; }

    /* ===== 规则列表卡片 ===== */
    .list-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; }

    /* ===== 表格内标签配色 ===== */
    .el-tag.tag-ip { background: rgba(47,123,246,0.12) !important; color: var(--accent) !important; border: none !important; }
    .el-tag.tag-uri { background: rgba(34,197,94,0.12) !important; color: var(--success) !important; border: none !important; }
    .el-tag.tag-header { background: rgba(139,92,246,0.12) !important; color: var(--purple) !important; border: none !important; }
    .el-tag.tag-query { background: rgba(245,158,11,0.12) !important; color: var(--warning) !important; border: none !important; }
    .el-tag.tag-allow { background: rgba(34,197,94,0.12) !important; color: var(--success) !important; border: none !important; }
    .el-tag.tag-observe { background: rgba(245,158,11,0.12) !important; color: var(--warning) !important; border: none !important; }

    /* ===== 表格工具类 ===== */
    .mono { font-family: "SF Mono", Consolas, monospace; color: var(--text-primary); }
    .text-muted { color: var(--text-muted); }
    .operator-text { font-size: 11px; color: var(--text-muted); margin-left: 4px; }
    .skip-text { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .drag-handle { cursor: grab; color: var(--text-muted); font-size: 14px; }
    .drag-handle:active { cursor: grabbing; }

    /* ===== 操作按钮组 ===== */
    .row-actions { display: inline-flex; gap: 6px; }
    .row-actions .el-button + .el-button { margin-left: 0; }

    /* ============================================================
       深浅色兜底（即使 element-reset 未加载也保证输入框/下拉框不显白底）
       ============================================================ */
    .el-input__wrapper { background-color: var(--bg-card) !important; box-shadow: 0 0 0 1px var(--border) inset !important; }
    .el-input__wrapper.is-focus { box-shadow: 0 0 0 1px var(--accent) inset !important; }
    .el-input__inner { color: var(--text-primary) !important; }
    .el-select__wrapper { background-color: var(--bg-card) !important; box-shadow: 0 0 0 1px var(--border) inset !important; }
    .el-select__wrapper.is-focused { box-shadow: 0 0 0 1px var(--accent) inset !important; }
    .el-select__selected-item { color: var(--text-primary) !important; }
    .el-select__placeholder { color: var(--text-muted) !important; }
    .el-select__popper.el-popper, .el-select-dropdown { background: var(--bg-card) !important; }
    .el-select-dropdown__item { color: var(--text-secondary); }
    .el-select-dropdown__item.is-hovering { background-color: var(--bg-card-hover); }
    .el-select-dropdown__item.is-selected { color: var(--accent); }
    .el-button--default { background-color: transparent !important; border-color: var(--border) !important; color: var(--text-secondary) !important; }
    .el-button--default:hover { background-color: transparent !important; border-color: var(--accent) !important; color: var(--accent) !important; }
    .el-button--primary { background-color: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
    .el-button--danger { background-color: rgba(239,68,68,0.12) !important; border-color: transparent !important; color: var(--danger) !important; }
    .el-pagination button, .el-pagination .el-pager li { background-color: var(--bg-card) !important; border: 1px solid var(--border); color: var(--text-secondary) !important; }
    .el-pagination .el-pager li.is-active { background-color: var(--accent) !important; color: #fff !important; border-color: var(--accent); }

    /* ===== 响应式 ===== */
    @media (max-width: 768px) {
      .page-container { padding: 14px; }
      .stats-row .el-col { margin-bottom: 10px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-right { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="page-container">
    <!-- ===== 统计卡片 ===== -->
    <el-row :gutter="16" class="stats-row">
      <el-col :xs="12" :sm="12" :md="6" v-for="s in statCards" :key="s.key">
        <div class="mini-stat">
          <div class="ms-icon" :class="s.iconClass"><i :class="'fa-solid ' + s.icon"></i></div>
          <div>
            <div class="ms-label">{{ s.label }}</div>
            <div class="ms-value">{{ s.value }}</div>
          </div>
        </div>
      </el-col>
    </el-row>

    <!-- ===== 筛选栏：Tab 切换 + 站点选择（裸 filter-bar，1:1 同 UI） ===== -->
    <div class="filter-bar">
      <div class="filter-left">
        <div class="tabs">
          <button type="button" class="tab" :class="{ active: currentScope === 'global' }" @click="switchScope('global')">全局白名单</button>
          <button type="button" class="tab" :class="{ active: currentScope === 'site' }" @click="switchScope('site')">站点私有白名单</button>
        </div>
        <template v-if="currentScope === 'site'">
          <span class="filter-label"><i class="fa-solid fa-server"></i></span>
          <el-select v-model="currentSiteId" @change="handleSiteChange" placeholder="全部站点" filterable style="width:180px; flex:0 0 auto">
            <el-option v-for="s in siteList" :key="s.id" :label="s.name + ' ' + s.domain" :value="s.id"></el-option>
          </el-select>
        </template>
      </div>
    </div>

    <!-- ===== 规则列表 ===== -->
    <div class="list-card">
      <div class="toolbar">
        <div class="toolbar-left">
          <el-input v-model="keyword" placeholder="搜索规则名称或匹配值..." clearable style="width:240px" @input="currentPage = 1">
            <template #prefix><i class="fa-solid fa-magnifying-glass"></i></template>
          </el-input>
        </div>
        <div class="toolbar-right">
          <el-button @click="openCloudRules"><i class="fa-solid fa-cloud"></i> 平台规则</el-button>
          <el-button @click="openImport"><i class="fa-solid fa-file-import"></i> 导入规则</el-button>
          <el-button type="primary" @click="openAdd"><i class="fa-solid fa-plus"></i> 新增规则</el-button>
        </div>
      </div>

      <el-table :data="pageData" row-key="id" style="width:100%" empty-text="暂无匹配规则">
        <el-table-column label="" width="40" align="center">
          <template #default><i class="fa-solid fa-grip-vertical drag-handle" title="拖拽排序"></i></template>
        </el-table-column>
        <el-table-column label="规则名称" min-width="150">
          <template #default="{ row }"><span class="mono">{{ row.name }}</span></template>
        </el-table-column>
        <el-table-column label="匹配条件" width="170">
          <template #default="{ row }">
            <el-tag :class="'tag-' + row.target" effect="plain">{{ targetMap[row.target] || row.target }}</el-tag>
            <span v-if="row.target !== 'ip_group'" class="operator-text">{{ operatorMap[row.operator] || row.operator }}</span>
          </template>
        </el-table-column>
        <el-table-column label="匹配值" min-width="170" show-overflow-tooltip>
          <template #default="{ row }"><span class="mono">{{ row.value }}</span></template>
        </el-table-column>
        <el-table-column label="动作" width="180">
          <template #default="{ row }">
            <el-tag :class="row.action === 'pass' ? 'tag-allow' : 'tag-observe'" effect="plain">
              <i :class="row.action === 'pass' ? 'fa-solid fa-circle-check' : 'fa-solid fa-eye'" style="margin-right:4px"></i>{{ row.action === 'pass' ? '放行' : '观察' }}
            </el-tag>
            <span v-if="row.action === 'pass'" class="skip-text">跳过：{{ skipText(row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="状态" width="80" align="center">
          <template #default="{ row }">
            <el-switch :model-value="row.status === 1" @change="v => handleStatusChange(row, v)"></el-switch>
          </template>
        </el-table-column>
        <el-table-column label="创建时间" width="150">
          <template #default="{ row }"><span class="text-muted">{{ row.create_time }}</span></template>
        </el-table-column>
        <el-table-column label="操作" width="150" fixed="right">
          <template #default="{ row }">
            <div class="row-actions">
              <el-button size="small" @click="openEdit(row)"><i class="fa-solid fa-pen"></i> 编辑</el-button>
              <el-button size="small" type="danger" @click="openDel(row)"><i class="fa-solid fa-trash"></i> 删除</el-button>
            </div>
          </template>
        </el-table-column>
      </el-table>

      <el-pagination
        background
        layout="prev, pager, next, total"
        :total="filteredData.length"
        :page-size="pageSize"
        :current-page="currentPage"
        @current-change="handlePageChange">
      </el-pagination>
    </div>
  </div>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const app = createApp({
  data() {
    return {
      rules: [],
      siteList: [],
      currentScope: 'global',
      currentSiteId: '',
      currentPage: 1,
      pageSize: 6,
      keyword: '',
      targetMap: { ip: '源IP', uri: 'URI', header: 'Header', query: 'Query', ip_group: 'IP组' },
      operatorMap: { equal: '等于', contains: '包含', regex: '正则', in_ip_group: '属于IP组', not_in_ip_group: '不属于IP组' }
    };
  },
  computed: {
    statCards() {
      return [
        { key: 'active', label: '生效规则', value: this.rules.filter(r => r.status === 1).length, icon: 'fa-circle-check', iconClass: 'icon-green' },
        { key: 'total', label: '规则总数', value: this.rules.length, icon: 'fa-list', iconClass: 'icon-blue' },
        { key: 'allow', label: '放行动作', value: this.rules.filter(r => r.action === 'pass').length, icon: 'fa-shield-halved', iconClass: 'icon-purple' },
        { key: 'observe', label: '观察动作', value: this.rules.filter(r => r.action === 'observe').length, icon: 'fa-eye', iconClass: 'icon-orange' },
      ];
    },
    filteredData() {
      let list = this.rules;
      if (this.keyword) {
        const kw = this.keyword.toLowerCase();
        list = list.filter(r => (r.name || '').toLowerCase().includes(kw) || (r.value || '').toLowerCase().includes(kw));
      }
      return list;
    },
    pageData() {
      const start = (this.currentPage - 1) * this.pageSize;
      return this.filteredData.slice(start, start + this.pageSize);
    }
  },
  watch: {
    'filteredData.length'() {
      const tp = Math.max(1, Math.ceil(this.filteredData.length / this.pageSize));
      if (this.currentPage > tp) this.currentPage = 1;
    }
  },
  mounted() {
    ThemeManager.init();
    App.api.site.list(1, 100).then(({ list }) => {
      this.siteList = (list || []).map(s => ({ id: s.id, name: s.name, domain: (s.domains || '').split(',')[0] }));
      if (this.siteList.length && !this.currentSiteId) this.currentSiteId = this.siteList[0].id;
    }).catch(() => {});
    this.load();
    window.onSearch = () => this.load();
  },
  methods: {
    /* 平台规则 / 导入规则：iframe 弹窗页（与新增/编辑同模式），维护收在独立页面文件 */
    openCloudRules() {
      DialogBridge.open({ id: 'wl_cloud', title: '平台规则（白名单 · 云平台下发）', url: '/whitelist/cloud.html', width: '720px', height: 520 });
    },
    openImport() {
      DialogBridge.open({ id: 'wl_import', title: '导入规则', url: '/whitelist/import.html?site_id=' + this.currentSite(), width: '560px', height: 380 });
    },
    currentSite() { return this.currentScope === 'site' ? (this.currentSiteId || 0) : 0; },
    load() {
      App.api.whitelist.list(1, 1000, this.currentSite()).then(({ list }) => {
        this.rules = (list || []).map(r => ({
          id: r.id, site_id: r.site_id, name: r.name, target: r.target, operator: r.operator, value: r.value,
          skip_rule: r.skip_rule === 1, skip_challenge: r.skip_challenge === 1, skip_cc: r.skip_cc === 1,
          status: r.status === 1 ? 1 : 0, create_time: r.create_time,
          action: (r.skip_rule === 1 || r.skip_challenge === 1 || r.skip_cc === 1) ? 'pass' : 'observe'
        }));
      }).catch(() => {});
    },
    switchScope(scope) { this.currentScope = scope; this.keyword = ''; this.currentPage = 1; this.load(); },
    handleSiteChange() { this.keyword = ''; this.currentPage = 1; this.load(); },
    handlePageChange(page) { this.currentPage = page; },
    skipText(r) {
      const arr = [];
      if (r.skip_rule) arr.push('自定义规则');
      if (r.skip_challenge) arr.push('人机验证');
      if (r.skip_cc) arr.push('CC限速');
      return arr.length ? arr.join('、') : '无';
    },
    handleStatusChange(row, v) {
      App.api.whitelist.save({
        id: row.id, site_id: row.site_id, name: row.name, target: row.target, operator: row.operator, value: row.value,
        skip_rule: row.skip_rule ? 1 : 0, skip_challenge: row.skip_challenge ? 1 : 0, skip_cc: row.skip_cc ? 1 : 0,
        status: v ? 1 : 0
      }).then(() => {
        row.status = v ? 1 : 0;
        ElementPlus.ElMessage({ message: '规则 ' + row.name + ' 已' + (v ? '启用' : '禁用'), type: v ? 'success' : 'warning', duration: 2000 });
      }).catch(() => {});
    },
    openAdd() {
      DialogBridge.open({ id: 'wl_edit', title: '新增规则', url: '/whitelist/add.html?site_id=' + this.currentSite(), width: '780px', height: 560 });
    },
    openEdit(row) {
      DialogBridge.open({ id: 'wl_edit', title: '编辑规则', url: '/whitelist/add.html?id=' + row.id, width: '780px', height: 560 });
    },
    openDel(row) {
      const h = Vue.h;
      ElementPlus.ElMessageBox({
        title: '删除确认',
        message: h('div', null, [
          h('p', null, ['确定要删除白名单规则 ', h('span', { class: 'mbx-highlight' }, row.name), ' 吗？']),
          h('p', null, '删除后该规则将立即停止生效，且不可恢复。')
        ]),
        showCancelButton: true,
        confirmButtonText: '确认删除',
        cancelButtonText: '取消',
        confirmButtonType: 'danger',
        cancelButtonType: 'default',
        customClass: 'mb-del',
        autofocus: false,
        closeOnClickModal: false
      }).then(() => App.api.whitelist.remove(row.id))
        .then(() => {
          ElementPlus.ElMessage({ message: '规则已删除', type: 'success', duration: 2000 });
          this.load();
        }).catch(() => {});
    }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
