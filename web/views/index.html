<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAF 管理系统</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../static/css/reset.css">
  <link rel="stylesheet" href="../static/css/common.css">
  <link rel="stylesheet" href="../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../static/css/element-reset.css">
  <style>
    /* 主框架内容区改为 iframe 占满（覆盖 common.css 的 .content 内边距） */
    .content { padding: 0; overflow: hidden; }
    .content-frame { width: 100%; height: 100%; border: none; display: block; background: var(--bg-body); }
    /* 侧边栏 logo / 菜单图标颜色继承 */
    .sidebar .logo { padding: 0 18px; }
    /* 分组一级菜单 */
    .nav-group { margin-bottom: 2px; }
    .nav-group-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap; }
    .nav-group-head:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .nav-group-head .head-icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .nav-group-head .label { flex: 1; font-size: 13px; }
    .nav-group-head .arrow { font-size: 12px; transition: transform 0.2s; color: var(--text-muted); }
    .nav-group.open .nav-group-head { color: var(--accent); }
    .nav-group.open .nav-group-head .arrow { transform: rotate(180deg); }
    .nav-group-items { overflow: hidden; }
    .nav-group-items .nav-item { padding-left: 40px; }
    .sidebar.collapsed .nav-group-head { justify-content: center; padding: 10px 0; }
    .sidebar.collapsed .nav-group-head .label,
    .sidebar.collapsed .nav-group-head .arrow { display: none; }
    .sidebar.collapsed .nav-group-items { display: none; }
    /* 收起时只显示 logo 图标，隐藏名称 */
    .sidebar.collapsed .logo { justify-content: center; padding: 0; }
    .sidebar.collapsed .logo-text { display: none; }
    /* 收起时直达项只显示图标 */
    .sidebar.collapsed .nav-item { justify-content: center; padding: 10px 0; }
    .sidebar.collapsed .nav-item .label { display: none; }
    /* 收起时 hover 弹出的二级菜单浮层 */
    .pop-trigger { justify-content: center; padding: 10px 0; cursor: pointer; }
    .sidebar-pop { padding: 6px !important; border-radius: 8px !important; }
    .pop-menu-title { font-size: 12px; color: var(--text-muted); padding: 2px 8px 8px; }
    .pop-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; color: var(--text-secondary); cursor: pointer; font-size: 13px; text-decoration: none; transition: background 0.15s, color 0.15s; }
    .pop-item:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .pop-item.active { background: var(--accent-soft); color: var(--accent); }
    .pop-item .el-icon { flex-shrink: 0; }
    /* 收起按钮始终显示（任何屏幕都有展开/收起入口） */
    .sidebar-toggle { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-secondary); cursor: pointer; background: none; border: none; font-size: 15px; transition: all 0.2s; }
    .sidebar-toggle:hover { color: var(--accent); background: var(--bg-card-hover); }
    /* 汉堡按钮仅移动端显示（开抽屉） */
    .hamburger { display: none; }
    @media (max-width: 768px) {
      .hamburger { display: inline-flex; }
      /* 移动端只保留汉堡（开抽屉），隐藏桌面端的收起/展开按钮，避免两个“展开菜单”重复 */
      .sidebar-toggle { display: none; }
    /* ===== iframe 弹窗移动端全屏（避免固定宽度在手机端撑出屏幕） ===== */
      .frame-dialog {
        position: fixed !important;
        top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        margin: 0 !important;
        border-radius: 0 !important;
        display: flex;
        flex-direction: column;
      }
      .frame-dialog .el-dialog__header { flex-shrink: 0; }
      .frame-dialog .el-dialog__body { flex: 1; overflow: hidden; padding: 0; height: auto; }
      .frame-dialog iframe { height: 100% !important; }
    }
    /* ===== iframe 弹窗全屏按钮（header 内，参照 daiAdmin） ===== */
    .frame-dialog-header { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .frame-dialog-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .frame-dialog-actions { display: inline-flex; align-items: center; gap: 6px; }
    .fd-action { cursor: pointer; color: var(--text-secondary); }
    .fd-action:hover { color: var(--accent); }
    /* 全屏时 iframe 撑满弹窗 */
    .frame-dialog.el-dialog.is-fullscreen { display: flex; flex-direction: column; }
    .frame-dialog.el-dialog.is-fullscreen .el-dialog__body { flex: 1; overflow: hidden; padding: 0; height: auto; }
    .frame-dialog.el-dialog.is-fullscreen iframe { height: 100% !important; }
    /* 用户下拉按钮样式 */
    .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .user .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 600; }
    .user .name { color: var(--text-primary); font-size: 13px; }
    /* 侧边栏底部版本/edition 徽标（/api/system/info 驱动，登录后所有页可见） */
    .sidebar-footer { flex-shrink: 0; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; }
    .sidebar-footer .sf-version { margin-bottom: 4px; letter-spacing: 0.3px; }
    .sidebar-footer .sf-edition { display: flex; align-items: center; gap: 8px; }
    .edition-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; line-height: 1.6; border: 1px solid var(--border); color: var(--text-secondary); background: var(--bg-card); }
    .edition-badge.pro { border-color: rgba(139,92,246,0.45); color: #a78bfa; background: rgba(139,92,246,0.10); }
    .sf-upgrade { color: var(--accent); font-size: 11px; text-decoration: none; }
    .sf-upgrade:hover { text-decoration: underline; }
    .sidebar.collapsed .sidebar-footer { padding: 10px 0; text-align: center; }
    /* 主题按钮内图标 */
    .theme-btn { display: inline-flex; align-items: center; justify-content: center; }
    /* 移动端遮罩 */
    .mobile-overlay { display: none; }
    @media (max-width: 768px) {
      .mobile-overlay { display: block; position: fixed; inset: 0; top: var(--topbar-height); background: rgba(0,0,0,0.5); z-index: 190; }
      .sidebar { position: fixed; z-index: 200; height: 100%; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      /* 移动端抽屉保持收起态（只显示一级图标），点击一级图标由 el-popover(trigger=click) 浮动显示二级菜单 */
    }
  </style>
</head>
<body>
<div id="app" class="layout" v-cloak>
  <!-- ===== 侧边栏 ===== -->
  <aside class="sidebar" :class="{ collapsed: collapsed, open: mobileOpen }">
    <div class="logo">
      <div class="logo-icon"><el-icon :size="17"><Shield></Shield></el-icon></div>
      <div class="logo-text">WAF<span>管理系统</span></div>
    </div>
    <nav class="nav">
      <template v-for="g in menuGroups" :key="g.id">
        <a v-if="!g.items" class="nav-item" :class="{ active: activeKey === g.id }"
          @click.prevent="onMenuSelect(g.id)" :title="g.title">
          <el-icon><component :is="g.icon"></component></el-icon>
          <span class="label">{{ g.title }}</span>
        </a>
        <div v-else-if="!collapsed" class="nav-group" :class="{ open: expandedGroup === g.id }">
          <div class="nav-group-head" @click="toggleGroup(g.id)" :title="g.title">
            <span class="head-icon"><el-icon><component :is="g.icon"></component></el-icon></span>
            <span class="label">{{ g.title }}</span>
            <el-icon class="arrow"><ArrowDown></ArrowDown></el-icon>
          </div>
          <div class="nav-group-items" v-show="expandedGroup === g.id">
            <a class="nav-item" v-for="item in g.items" :key="item.id" :class="{ active: activeKey === item.id }"
              @click.prevent="onMenuSelect(item.id)" :title="item.title">
              <el-icon><component :is="item.icon"></component></el-icon>
              <span class="label">{{ item.title }}</span>
            </a>
          </div>
        </div>
        <el-popover v-else :visible="popGroup === g.id" placement="right-start" :width="220" popper-class="sidebar-pop" :show-arrow="false" @hide="popGroup = ''">
          <template #reference>
            <div class="nav-group-head pop-trigger" @click="togglePop(g.id)" :title="g.title">
              <span class="head-icon"><el-icon><component :is="g.icon"></component></el-icon></span>
            </div>
          </template>
          <div class="pop-menu">
            <div class="pop-menu-title">{{ g.title }}</div>
            <a v-for="item in g.items" :key="item.id" class="pop-item" :class="{ active: activeKey === item.id }"
              @click.prevent="onMenuSelect(item.id)">
              <el-icon><component :is="item.icon"></component></el-icon>
              <span>{{ item.title }}</span>
            </a>
          </div>
        </el-popover>
      </template>
    </nav>
    <!-- 版本与 edition 徽标（主布局页脚，登录后所有页可见；免费版附升级 Pro 引流入口） -->
    <div class="sidebar-footer" v-if="info">
      <template v-if="!collapsed">
        <div class="sf-version">{{ info.brand }} {{ info.version }}</div>
        <div class="sf-edition">
          <span class="edition-badge" :class="info.edition">{{ info.edition === 'pro' ? 'Pro' : '免费版' }}</span>
          <a v-if="info.edition !== 'pro'" href="javascript:;" class="sf-upgrade" title="升级 Pro 解锁全部能力">升级 Pro</a>
        </div>
      </template>
      <template v-else>
        <span class="edition-badge" :class="info.edition">{{ info.edition === 'pro' ? 'P' : 'F' }}</span>
      </template>
    </div>
  </aside>

  <!-- ===== 主区域 ===== -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" @click="toggleMobile" title="展开菜单">
          <el-icon :size="16"><component :is="'Menu'"></component></el-icon>
        </button>
        <button class="sidebar-toggle" @click="toggleSidebar" :title="collapsed ? '展开菜单' : '收起菜单'">
          <el-icon :size="16"><Fold v-if="!collapsed"></Fold><Expand v-else></Expand></el-icon>
        </button>
        <span class="page-title">{{ currentTitle }}</span>
      </div>
      <div class="topbar-right">
        <button class="theme-btn" @click="toggleTheme" :title="theme==='dark' ? '切换到浅色' : '切换到深色'">
          <el-icon :size="16"><Moon v-if="theme==='dark'"></Moon><Sunny v-else></Sunny></el-icon>
        </button>
        <button class="theme-btn" @click="refreshFrame" title="刷新当前页">
          <el-icon :size="16"><component :is="'Refresh'"></component></el-icon>
        </button>
        <el-dropdown trigger="click" @command="onUserCmd">
          <div class="user">
            <div class="avatar">{{ avatarChar }}</div>
            <span class="name">{{ username }}</span>
            <el-icon :size="12"><ArrowDown></ArrowDown></el-icon>
          </div>
          <template #dropdown>
            <el-dropdown-menu>
              <el-dropdown-item command="pwd">修改密码</el-dropdown-item>
              <el-dropdown-item command="logout" divided>退出登录</el-dropdown-item>
            </el-dropdown-menu>
          </template>
        </el-dropdown>
      </div>
    </header>

    <div class="content">
      <iframe class="content-frame" id="contentFrame" :src="currentUrl" frameborder="0"></iframe>
    </div>
  </div>

  <!-- 移动端遮罩 -->
  <div class="mobile-overlay" v-if="mobileOpen" @click="mobileOpen=false"></div>

  <!-- ===== 修改密码弹窗 ===== -->
  <el-dialog v-model="pwdVisible" title="修改密码" width="420px">
    <el-form :model="pwdForm" label-width="90px">
      <el-form-item label="原密码" required>
        <el-input v-model="pwdForm.old_password" type="password" show-password placeholder="请输入原密码"></el-input>
      </el-form-item>
      <el-form-item label="新密码" required>
        <el-input v-model="pwdForm.new_password" type="password" show-password placeholder="请输入新密码"></el-input>
      </el-form-item>
      <el-form-item label="确认密码" required>
        <el-input v-model="pwdForm.confirm" type="password" show-password placeholder="请再次输入新密码"></el-input>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="pwdVisible=false">取消</el-button>
      <el-button type="primary" :loading="pwdLoading" @click="submitPwd">确定</el-button>
    </template>
  </el-dialog>

  <!-- ===== iframe 弹窗（daiAdmin 模式：子页面通过 postMessage 打开） ===== -->
  <el-dialog v-model="dialogState.visible" :width="dialogState.width" :fullscreen="dialogState.fullscreen"
    class="frame-dialog" :close-on-click-modal="false" destroy-on-close>
    <template #header>
      <div class="frame-dialog-header">
        <span class="frame-dialog-title">{{ dialogState.title }}</span>
        <span class="frame-dialog-actions">
          <el-icon v-if="!dialogState.fullscreen" @click="dialogState.fullscreen = true" class="fd-action" :size="16" title="全屏">
            <full-screen />
          </el-icon>
          <el-icon v-else @click="dialogState.fullscreen = false" class="fd-action" :size="16" title="还原">
            <copy-document />
          </el-icon>
        </span>
      </div>
    </template>
    <iframe :src="dialogState.url" :style="{ width: '100%', height: dialogState.fullscreen ? '100%' : dialogState.height + 'px', border: 'none', display: 'block' }"></iframe>
  </el-dialog>
</div>

<script src="../static/js/config/theme.js"></script>
<script src="../static/js/config/locale.js"></script>
<script src="../static/js/config/menu.js"></script>
<script src="../static/lib/vue.min.js"></script>
<script src="../static/lib/element-plus/index.js"></script>
<script src="../static/lib/element-plus-icons/index.js"></script>
<script src="../static/js/api.js"></script>
<script>
const { createApp } = Vue;

const app = createApp({
  data() {
    return {
      menuGroups: MenuConfig.groups,
      collapsed: false,
      mobileOpen: false,
      theme: 'dark',
      activeKey: 'dashboard',
      expandedGroup: '',
      popGroup: '', // 当前展开浮层二级菜单的分组 id（收起态点击一级图标）
      username: 'admin',
      pwdVisible: false,
      pwdLoading: false,
      pwdForm: { old_password: '', new_password: '', confirm: '' },
      dialogState: { visible: false, id: null, title: '', url: '', width: '600px', height: 400, fullscreen: false },
      info: null // 版本与授权信息（/api/system/info，侧边栏底部徽标展示）
    };
  },
  computed: {
    currentUrl() {
      const item = MenuConfig.findMenu(this.activeKey);
      return item ? ('/' + item.path) : '/dashboard.html';
    },
    currentTitle() {
      const item = MenuConfig.findMenu(this.activeKey);
      return item ? item.title : '仪表盘';
    },
    avatarChar() {
      return (this.username || 'A').charAt(0).toUpperCase();
    }
  },
  mounted() {
    ThemeManager.init();
    this.theme = ThemeManager.getConfig().theme;
    // 同步内存 collapsed 与持久化配置，避免首次点击“展开菜单”无效
    if (ThemeManager.shouldCollapseSidebar() && !ThemeManager.getConfig().sidebarCollapsed) {
      ThemeManager.setSidebarCollapsed(true);
    }
    this.collapsed = ThemeManager.getConfig().sidebarCollapsed;
    this.username = sessionStorage.getItem('waf_admin_name') || 'admin';
    // 拉取品牌/版本/edition（一次全局缓存，侧边栏底部徽标与升级 Pro 入口）
    App.loadInfo().then((info) => {
      this.info = info;
      // Pro 独占菜单过滤：免费版不渲染 edition:'pro' 项（如"授权管理"）
      this.menuGroups = this.filterMenu(info);
    });

    // 根据当前地址定位菜单（若直链到子页面），并展开其所属分组
    // hash 优先（如 /#license，供子页 href="/#license" target="_top" 真链接整页跳转后定位授权管理菜单）
    const hashId = (window.location.hash || '').replace('#', '').trim();
    const menu = (hashId && MenuConfig.findMenu(hashId)) || MenuConfig.findMenu(MenuConfig.getCurrentPageId());
    if (menu) {
      this.activeKey = menu.id;
      const gid = MenuConfig.getGroupId(menu.id);
      if (gid) this.expandedGroup = gid;
    }
    this.$nextTick(() => ThemeManager.notifyIframe());
    // 收起态浮层：点击图标/浮层之外关闭二级菜单
    document.addEventListener('click', this.onGlobalClick);
    this.initDialogBridge();
  },
  beforeUnmount() {
    document.removeEventListener('click', this.onGlobalClick);
  },
  methods: {
    /* filterMenu 按 edition 过滤菜单：免费版剔除 edition:'pro' 项（空分组一并剔除） */
    filterMenu(info) {
      const isPro = !!(info && info.edition === 'pro');
      const out = [];
      MenuConfig.groups.forEach((g) => {
        if (g.items) {
          const items = g.items.filter(i => isPro || i.edition !== 'pro');
          if (items.length) out.push(Object.assign({}, g, { items: items }));
        } else if (isPro || g.edition !== 'pro') {
          out.push(g);
        }
      });
      return out;
    },
    onMenuSelect(id) {
      this.activeKey = id;
      this.mobileOpen = false;
      this.popGroup = '';
      this.$nextTick(() => ThemeManager.notifyIframe());
    },
    togglePop(id) {
      // 收起态一级图标：点击切换浮层二级菜单显示/隐藏
      this.popGroup = this.popGroup === id ? '' : id;
    },
    onGlobalClick(e) {
      // 点击浮层/触发图标之外 → 关闭浮层二级菜单
      if (this.popGroup && !e.target.closest('.pop-trigger') && !e.target.closest('.el-popper')) {
        this.popGroup = '';
      }
    },
    toggleGroup(id) {
      // 展开状态：点击一级菜单展开/收起子项
      this.expandedGroup = this.expandedGroup === id ? '' : id;
    },
    toggleSidebar() {
      this.collapsed = ThemeManager.toggleSidebar();
    },
    toggleMobile() {
      this.mobileOpen = !this.mobileOpen;
    },
    toggleTheme() {
      this.theme = ThemeManager.toggleTheme();
    },
    refreshFrame() {
      const iframe = document.getElementById('contentFrame');
      if (iframe && iframe.contentWindow) {
        try { iframe.contentWindow.location.reload(); } catch (e) { iframe.src = iframe.src; }
      }
    },
    onUserCmd(cmd) {
      if (cmd === 'logout') {
        App.api.common.logout().finally(() => {
          sessionStorage.removeItem('waf_admin_name');
          window.location.href = '/login.html';
        });
      } else if (cmd === 'pwd') {
        this.pwdForm = { old_password: '', new_password: '', confirm: '' };
        this.pwdVisible = true;
      }
    },
    submitPwd() {
      if (!this.pwdForm.old_password || !this.pwdForm.new_password) {
        ElementPlus.ElMessage.warning('请填写完整');
        return;
      }
      if (this.pwdForm.new_password !== this.pwdForm.confirm) {
        ElementPlus.ElMessage.warning('两次输入的新密码不一致');
        return;
      }
      this.pwdLoading = true;
      App.api.common.changePwd(this.pwdForm.old_password, this.pwdForm.new_password)
        .then(() => {
          ElementPlus.ElMessage.success('密码修改成功');
          this.pwdVisible = false;
        })
        .finally(() => { this.pwdLoading = false; });
    },
    /* ===== iframe 弹窗桥接：接收子页面 postMessage 打开/关闭弹窗 ===== */
    initDialogBridge() {
      window.addEventListener('message', (e) => {
        const d = e.data || {};
        if (d.action === 'creat_dialog') {
          this.dialogState = {
            visible: true,
            id: d.id,
            title: d.title || '弹窗',
            url: d.url || '',
            width: d.width || '600px',
            height: d.height || 400,
            // 移动端自动全屏（Element Plus 原生 fullscreen，避免固定宽度溢出手机屏）
            fullscreen: d.fullscreen || window.innerWidth <= 768
          };
        } else if (d.action === 'close_dialog') {
          this.dialogState.visible = false;
          // 关闭弹窗后刷新子页列表（DialogBridge 约定：refresh !== false 时调子页 onSearch）
          if (d.refresh !== false) {
            this.$nextTick(() => {
              const iframe = document.getElementById('contentFrame');
              if (iframe && iframe.contentWindow && typeof iframe.contentWindow.onSearch === 'function') {
                iframe.contentWindow.onSearch();
              }
            });
          }
        } else if (d.action === 'menu_goto' && d.id) {
          // 子页跨 iframe 切换菜单（如仪表盘授权到期横幅 → 授权管理页）。
          // 与菜单点击等价但更直接：查 MenuConfig 取目标路径后直接设置 iframe src，
          // 同时同步 activeKey（菜单高亮）/ expandedGroup（分组展开），不依赖响应式链中间环节
          const item = MenuConfig.findMenu(d.id);
          if (!item) return;
          this.activeKey = d.id;
          const gid = MenuConfig.getGroupId(d.id);
          if (gid) this.expandedGroup = gid;
          const targetUrl = '/' + item.path;
          this.$nextTick(() => {
            const iframe = document.getElementById('contentFrame');
            if (iframe && iframe.getAttribute('src') !== targetUrl) {
              iframe.setAttribute('src', targetUrl);
            }
          });
        }
      });
    }
  }
});
// 注册所有 Element Plus 图标
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(name, comp);
  // in-DOM 模板会小写化标签名，注册小写别名保证图标能解析
  app.component(name.toLowerCase(), comp);
}
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
