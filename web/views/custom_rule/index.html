<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自定义规则</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <style>
    /* ============================================================
       自定义规则页面样式（1:1 对齐 UI/custom_rule）
       ============================================================ */
    html, body { height: 100%; }
    #app { height: 100%; }
    .page-container { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; background: var(--content-gradient), var(--bg-body); }
    .page-container::-webkit-scrollbar { width: 6px; }
    .page-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* ===== 通用弹窗（删除/新增编辑共用遮罩） ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 380px; max-width: 90%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal.wide { width: 680px; }
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-icon { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .modal-icon.danger { background: rgba(239,68,68,0.12); color: var(--danger); }
    .modal-icon.accent { background: var(--accent-soft); color: var(--accent); }
    .modal-title { font-size: 14px; font-weight: 600; }
    .modal-body { padding: 18px 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .modal-body .rule-name { color: var(--text-primary); font-weight: 600; font-family: "SF Mono", Consolas, monospace; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; border-top: 1px solid var(--border); }
    .modal-close { margin-left: auto; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 4px; }
    .modal-close:hover { color: var(--text-primary); }

    /* ===== 表单网格 ===== */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
    .form-grid .full { grid-column: 1 / -1; }

    /* ===== 条件组编辑器 ===== */
    .cond-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
    .cond-row .cond-target { width: 130px; flex-shrink: 0; }
    .cond-row .cond-op { width: 130px; flex-shrink: 0; }
    .cond-row .cond-value { flex: 1; min-width: 0; }
    .cond-row .cond-del { width: 38px; height: 38px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
    .cond-row .cond-del:hover { color: var(--danger); border-color: var(--danger); }
    .add-cond { margin-top: 4px; }
    .logic-row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
    .logic-row .logic-select { width: 110px; flex-shrink: 0; }
    .logic-row .logic-tip { font-size: 12px; color: var(--text-secondary); }

    /* ===== 开关行 ===== */
    .toggle-row { display: flex; align-items: center; gap: 12px; height: 38px; }
    .toggle-row .switch { flex-shrink: 0; }
    .toggle-row .toggle-tip { font-size: 12px; color: var(--text-secondary); }
    td .switch { vertical-align: middle; }

    /* ===== 行操作按钮组 ===== */
    .row-actions { display: inline-flex; gap: 6px; }
    .row-actions .el-button + .el-button { margin-left: 0; }

    /* ===== 命中次数高亮 ===== */
    .hit-count { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(239,68,68,0.12); color: var(--danger); }
    .hit-count.zero { background: rgba(100,116,139,0.15); color: var(--text-muted); font-weight: 500; }

    /* ===== 逻辑关系标签 ===== */
    .tag-logic { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
    .tag-logic.and { background: var(--accent-soft); color: var(--accent); }
    .tag-logic.or { background: rgba(139,92,246,0.12); color: var(--purple); }

    /* ===== 处置动作标签 ===== */
    .tag-act { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .tag-act.block { background: rgba(239,68,68,0.12); color: var(--danger); }
    .tag-act.challenge { background: rgba(245,158,11,0.12); color: var(--warning); }
    .tag-act.observe { background: rgba(20,184,166,0.12); color: var(--teal); }
    .tag-act.redirect { background: rgba(47,123,246,0.12); color: var(--accent); }

    /* ===== 拖拽 ===== */
    .drag-handle { cursor: grab; color: var(--text-muted); font-size: 14px; }
    .drag-handle:active { cursor: grabbing; }
    tr.dragging { opacity: 0.4; }
    tr.drag-over { box-shadow: inset 0 2px 0 var(--accent); }

    /* ===== 条件组数 ===== */
    .cond-count { color: var(--text-primary); font-weight: 600; }

    /* ===== 全局/站点 tab 切换 ===== */
    .tabs-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .tabs-bar .tabs-extra { font-size: 12px; color: var(--text-muted); }
    table.scope-global .col-site { display: none; }

    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .cond-row { flex-wrap: wrap; }
      .cond-row .cond-target, .cond-row .cond-op { width: calc(50% - 5px); }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="page-container">
    <!-- Tab 切换 -->
    <div class="tabs-bar">
      <div class="tabs">
        <button class="tab" :class="{ active: scope === 'global' }" @click="switchScope('global')">全局规则</button>
        <button class="tab" :class="{ active: scope === 'site' }" @click="switchScope('site')">站点私有规则</button>
      </div>
      <span class="tabs-extra">{{ scopeTip }}</span>
    </div>
    <!-- 规则列表 -->
    <div class="section-title">自定义规则<span class="sub">Custom Rules</span></div>
    <div class="card">
      <div class="card-body" style="padding:0;">
        <!-- 工具栏 -->
        <div class="toolbar" style="margin-bottom:0;padding:14px 16px;border-bottom:1px solid var(--border);">
          <div class="toolbar-left">
            <el-select v-if="scope === 'site'" v-model="filterSite" style="width:180px;" placeholder="全部站点" clearable @change="onFilterChange">
              <el-option label="全部站点" :value="''"></el-option>
              <el-option v-for="s in sites" :key="s.id" :label="s.name" :value="s.id"></el-option>
            </el-select>
            <el-input v-model="keyword" @input="onSearch" placeholder="按规则名称搜索..." clearable style="width:220px">
              <template #prefix><i class="fa-solid fa-magnifying-glass"></i></template>
            </el-input>
          </div>
          <div class="toolbar-right">
            <el-button @click="openCloudRules"><i class="fa-solid fa-cloud"></i> 平台规则</el-button>
            <el-button @click="openImport"><i class="fa-solid fa-file-import"></i> 批量导入</el-button>
            <el-button type="primary" @click="openAdd"><i class="fa-solid fa-plus"></i> 新增规则</el-button>
          </div>
        </div>
        <!-- 表格（el-table；行拖拽事件由外层容器代理后转发原拖拽函数，JS 逻辑不变） -->
        <div class="table-wrap"
             @mousedown="tableMousedown" @dragstart="tableDragstart" @dragend="tableDragend"
             @dragover.prevent="tableDragover" @drop="tableDrop">
          <el-table :data="paged" row-key="id" style="width:100%" empty-text="暂无匹配规则"
            :row-class-name="({ row }) => (row.id === dragId ? 'dragging' : '') + (row.id === dragOverId ? ' drag-over' : '')">
            <el-table-column label="排序" width="80" align="center">
              <template #default><i class="fa-solid fa-grip-vertical drag-handle" title="拖拽排序"></i></template>
            </el-table-column>
            <el-table-column v-if="scope === 'site'" label="所属站点" min-width="110">
              <template #default="{ row }"><span class="mono">{{ siteName(row.site_id) || '全局' }}</span></template>
            </el-table-column>
            <el-table-column label="规则名称" min-width="150">
              <template #default="{ row }"><span class="mono">{{ row.name }}</span></template>
            </el-table-column>
            <el-table-column label="条件组数" width="110">
              <template #default="{ row }"><span class="cond-count">{{ condCount(row.conditions) }}</span> 组条件</template>
            </el-table-column>
            <el-table-column label="逻辑关系" width="90">
              <template #default="{ row }"><span class="tag-logic" :class="isOr(row.logic) ? 'or' : 'and'">{{ isOr(row.logic) ? 'OR' : 'AND' }}</span></template>
            </el-table-column>
            <el-table-column label="处置动作" width="120">
              <template #default="{ row }"><span class="tag-act" :class="actionMeta(row.action).cls"><i class="fa-solid" :class="actionMeta(row.action).icon"></i> {{ actionMeta(row.action).label }}</span></template>
            </el-table-column>
            <el-table-column label="状态" width="80" align="center">
              <template #default="{ row }">
                <el-switch :model-value="row.status === 1" @change="v => toggleStatus(row, { target: { checked: v } })"></el-switch>
              </template>
            </el-table-column>
            <el-table-column label="今日命中" width="90">
              <template #default="{ row }"><span class="hit-count" :class="{ zero: !(parseInt(row.hits, 10) > 0) }">{{ fmtHits(row.hits) }}</span></template>
            </el-table-column>
            <el-table-column label="创建时间" width="150">
              <template #default="{ row }"><span class="text-muted">{{ row.create_time || '-' }}</span></template>
            </el-table-column>
            <el-table-column label="操作" width="150">
              <template #default="{ row }">
                <div class="row-actions">
                  <el-button size="small" @click="openEdit(row)"><i class="fa-solid fa-pen"></i> 编辑</el-button>
                  <el-button size="small" type="danger" @click="openDel(row)"><i class="fa-solid fa-trash"></i> 删除</el-button>
                </div>
              </template>
            </el-table-column>
          </el-table>
        </div>
        <!-- 分页 -->
        <el-pagination
          background
          layout="prev, pager, next, total"
          :total="total"
          :page-size="pageSize"
          :current-page="page"
          @current-change="goPage">
        </el-pagination>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-mask" v-show="delModal.show" @click.self="closeDelModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-icon danger"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <span class="modal-title">删除确认</span>
      </div>
      <div class="modal-body">确定要删除规则 <span class="rule-name">{{ delModal.name }}</span> 吗？<br>删除后该规则将停止生效且不可恢复。</div>
      <div class="modal-footer">
        <el-button @click="closeDelModal">取消</el-button>
        <el-button type="danger" @click="confirmDel"><i class="fa-solid fa-trash"></i> 确认删除</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const app = createApp({
  data() {
    return {
      scope: 'global',
      filterSite: '',
      keyword: '',
      list: [], sites: [],
      page: 1, pageSize: 5,
      dragId: null, dragOverId: null, dragRow: null,
      actionMap: {
        observe: { label: '观察', cls: 'observe', icon: 'fa-eye' },
        block: { label: '直接拦截', cls: 'block', icon: 'fa-ban' },
        challenge: { label: '人机验证', cls: 'challenge', icon: 'fa-user-check' },
        redirect: { label: '302重定向', cls: 'redirect', icon: 'fa-arrow-right' }
      },
      delModal: { show: false, id: null, name: '' }
    };
  },
  computed: {
    scopeTip() { return this.scope === 'global' ? '全局规则对所有站点生效' : '私有规则仅对指定站点生效'; },
    scoped() {
      if (this.scope === 'global') return this.list.filter(r => !r.site_id);
      return this.list.filter(r => r.site_id);
    },
    filtered() {
      let list = this.scoped;
      if (this.filterSite) list = list.filter(r => r.site_id === this.filterSite || !r.site_id);
      const k = this.keyword.trim().toLowerCase();
      if (k) list = list.filter(r => (r.name || '').toLowerCase().includes(k));
      return list;
    },
    total() { return this.filtered.length; },
    totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
    colCount() { return this.scope === 'site' ? 10 : 9; },
    pageItems() {
      const tp = this.totalPages, cur = this.page;
      const items = [];
      for (let i = 1; i <= tp; i++) {
        if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) items.push(i);
        else if (i === cur - 3 || i === cur + 3) items.push('...');
      }
      return items;
    },
    paged() {
      const start = (this.page - 1) * this.pageSize;
      return this.filtered.slice(start, start + this.pageSize);
    }
  },
  watch: {
    'filtered.length'() {
      if (this.page > this.totalPages) this.page = 1;
    }
  },
  mounted() {
    ThemeManager.init();
    App.api.site.list(1, 100).then(({ list }) => {
      this.sites = list || [];
      if (this.sites.length && !this.filterSite) this.filterSite = this.sites[0].id;
    }).catch(() => {});
    this.load();
    window.onSearch = () => this.load();
  },
  methods: {
    /* 平台规则 / 批量导入：iframe 弹窗页（与新增/编辑同模式），维护收在独立页面文件 */
    openCloudRules() {
      DialogBridge.open({ id: 'cr_cloud', title: '平台规则（拦截型 · 云平台下发）', url: '/custom_rule/cloud.html', width: '720px', height: 520 });
    },
    openImport() {
      DialogBridge.open({ id: 'cr_import', title: '批量导入自定义规则', url: '/custom_rule/import.html?site_id=' + this.currentSiteId(), width: '680px', height: 540 });
    },
    siteName(id) { const s = this.sites.find(x => x.id === id); return s ? s.name : ''; },
    isOr(logic) { return (logic || 'and').toLowerCase() === 'or'; },
    actionMeta(a) { return this.actionMap[a] || this.actionMap.observe; },
    fmtHits(v) { return (parseInt(v, 10) || 0).toLocaleString(); },
    condCount(str) {
      try {
        const a = JSON.parse(str || '[]');
        if (!Array.isArray(a)) return 0;
        let n = 0;
        a.forEach(g => { if (g && Array.isArray(g.conditions)) n += g.conditions.length; });
        return n;
      } catch (e) { return 0; }
    },
    load() {
      // 按当前作用域传 site_id：global=0，site=所选站点；后端按 "site_id=? OR site_id=0" 返回全局+该站点规则
      App.api.customRule.list(1, 10000, this.currentSiteId()).then(({ list }) => {
        this.list = list || [];
        this.page = 1;
      }).catch(() => {});
    },
    onSearch() { this.page = 1; },
    onFilterChange() { this.page = 1; this.load(); },
    goPage(p) { this.page = p; },
    switchScope(s) {
      this.scope = s;
      this.page = 1;
      this.keyword = '';
      if (s === 'site') {
        if (!this.filterSite && this.sites.length) this.filterSite = this.sites[0].id;
      } else {
        this.filterSite = '';
      }
      this.load();
    },
    toggleStatus(r, e) {
      const v = e.target.checked ? 1 : 0;
      App.api.customRule.save({
        id: r.id, site_id: r.site_id, name: r.name, conditions: r.conditions,
        action: r.action, logic: r.logic, sort: r.sort || 0, status: v
      }).then(() => {
        r.status = v;
        ElementPlus.ElMessage.success(`规则 ${r.name} 已${v === 1 ? '启用' : '停用'}`);
      }).catch(() => {});
    },
    /* 仅从拖拽手柄发起拖拽 */
    rowMouseDown(r, e) {
      const tr = e.target.closest('tr');
      if (tr) tr.draggable = !!e.target.closest('.drag-handle');
      this.dragRow = r;
    },
    dragStart(r, e) {
      this.dragId = r.id;
      e.dataTransfer.effectAllowed = 'move';
    },
    dragEnd(e) {
      const tr = e.target.closest('tr');
      if (tr) tr.draggable = false;
      this.dragId = null;
      this.dragOverId = null;
    },
    dragOver(r) { if (r.id !== this.dragId) this.dragOverId = r.id; },
    drop(r) {
      if (this.dragId && r.id !== this.dragId) {
        const list = this.list.slice();
        const from = list.findIndex(x => x.id === this.dragId);
        const to = list.findIndex(x => x.id === r.id);
        if (from !== -1 && to !== -1) {
          const [moved] = list.splice(from, 1);
          list.splice(to, 0, moved);
          this.list = list;
          App.api.customRule.sort(list.map(x => x.id)).then(() => ElementPlus.ElMessage.success('排序已更新')).catch(() => {});
        }
      }
      this.dragId = null;
      this.dragOverId = null;
    },
    /* ===== el-table 行拖拽桥接：el-table 无法在 tr 上直接绑定原生拖拽事件，
       在外层容器代理事件、按 DOM 位置映射回行数据后转发上方原函数（原拖拽函数未改动） ===== */
    rowFromTr(tr) {
      if (!tr || !tr.parentElement || tr.parentElement.tagName !== 'TBODY') return null;
      const idx = Array.prototype.indexOf.call(tr.parentElement.children, tr);
      return this.paged[idx] || null;
    },
    tableMousedown(e) { const row = this.rowFromTr(e.target.closest('tr')); if (row) this.rowMouseDown(row, e); },
    tableDragstart(e) { const row = this.rowFromTr(e.target.closest('tr')); if (row) this.dragStart(row, e); },
    tableDragover(e) { const row = this.rowFromTr(e.target.closest('tr')); if (row) this.dragOver(row); },
    tableDrop(e) { const row = this.rowFromTr(e.target.closest('tr')); if (row) this.drop(row, e); },
    tableDragend(e) { this.dragEnd(e); },
    openAdd() {
      DialogBridge.open({ id: 'cr_edit', title: '新增规则', url: '/custom_rule/add.html?site_id=' + this.currentSiteId(), width: '780px', height: 640 });
    },
    openEdit(r) {
      DialogBridge.open({ id: 'cr_edit', title: '编辑规则', url: '/custom_rule/add.html?id=' + r.id, width: '780px', height: 640 });
    },
    currentSiteId() { return this.scope === 'site' ? (this.filterSite || 0) : 0; },
    openDel(r) { this.delModal = { show: true, id: r.id, name: r.name }; },
    closeDelModal() { this.delModal.show = false; },
    confirmDel() {
      App.api.customRule.remove(this.delModal.id).then(() => {
        ElementPlus.ElMessage.success('规则已删除');
        this.delModal.show = false;
        this.load();
      }).catch(() => {});
    }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
