<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引擎错误日志</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <style>
    /* ===== 弹窗 ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 520px; max-width: 92%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal.modal-extra { width: 680px; }
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .modal-title .modal-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .modal-icon.icon-blue { background: var(--accent-soft); color: var(--accent); }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px; }
    .modal-close:hover { color: var(--text-primary); }
    .modal-body { padding: 18px 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; border-top: 1px solid var(--border); }

    /* 筛选栏 */
    .filter-bar { flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-group .select { min-width: 150px; }
    .filter-group .search-box input { width: 160px; }

    /* 模块标签 */
    .tag-module { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-family: "SF Mono", Consolas, monospace; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); }

    /* 消息列截断 */
    td .msg-text { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-actions { display: inline-flex; gap: 6px; }

    /* 详情弹窗 */
    .detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .detail-time { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 16px; }
    .detail-list > div { display: flex; flex-direction: column; gap: 3px; }
    .detail-list > div.full { grid-column: 1 / -1; }
    .detail-list dt { font-size: 11px; color: var(--text-muted); }
    .detail-list dd { font-size: 13px; color: var(--text-primary); word-break: break-all; }
    .detail-section { font-size: 12px; color: var(--text-secondary); margin: 4px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

    /* JSON 数据块 */
    .json-block { background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: "SF Mono", Consolas, monospace; font-size: 12px; color: var(--text-secondary); white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; line-height: 1.5; }
    .json-block::-webkit-scrollbar { width: 5px; }
    .json-block::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (max-width: 768px) { .detail-list { grid-template-columns: 1fr; } .modal.modal-extra { width: 100%; } }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="layout">
    <div class="main">
      <div class="content">
        <!-- 统计卡片 -->
        <div class="stat-grid cols-3">
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">今日错误数</span>
              <span class="stat-icon icon-red"><el-icon :size="15"><component :is="'WarningFilled'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statTotal }}</div>
            <div class="stat-change">当前查询条件内</div>
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">累计错误次数</span>
              <span class="stat-icon icon-orange"><el-icon :size="15"><component :is="'Warning'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statCount }}</div>
            <div class="stat-change">去重后的累计出现次数</div>
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">影响模块</span>
              <span class="stat-icon icon-blue"><el-icon :size="15"><component :is="'Grid'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statModule }}</div>
            <div class="stat-change">产生错误的模块数量</div>
          </div>
        </div>

        <!-- 筛选栏 -->
        <div class="section-title">错误日志 <span class="sub">引擎运行过程中的错误和警告信息</span></div>
        <div class="filter-bar">
          <div class="filter-left">
            <div class="filter-group">
              <label class="filter-label"><el-icon :size="14"><component :is="'Grid'"/></el-icon>模块</label>
              <el-select v-model="f.module" placeholder="全部" clearable @change="load" style="width:130px;">
                <el-option value="tls" label="TLS 证书"></el-option>
                <el-option value="proxy" label="反向代理"></el-option>
                <el-option value="cache" label="缓存"></el-option>
              </el-select>
            </div>
            <div class="filter-group">
              <label class="filter-label"><el-icon :size="14"><component :is="'Clock'"/></el-icon>时间范围</label>
              <el-select v-model="f.range" @change="load" style="width:130px;">
                <el-option value="24h" label="近24小时"></el-option>
                <el-option value="7d" label="近7天"></el-option>
                <el-option value="30d" label="近30天"></el-option>
              </el-select>
            </div>
            <div class="filter-group">
              <el-input v-model="f.keyword" placeholder="搜索消息内容..." style="width:180px;" @keyup.enter="load">
                <template #prefix><el-icon :size="14"><component :is="'Search'"/></el-icon></template>
              </el-input>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <el-button @click="reset"><el-icon :size="13"><component :is="'RefreshLeft'"/></el-icon> 重置</el-button>
            <el-button type="primary" @click="load"><el-icon :size="13"><component :is="'Search'"/></el-icon> 查询</el-button>
          </div>
        </div>

        <!-- 日志表格 -->
        <div class="card">
          <div class="card-body" style="padding:0;">
            <div class="toolbar" style="margin-bottom:0;padding:14px 16px;border-bottom:1px solid var(--border);">
              <div class="toolbar-left">
                <span class="filter-label"><el-icon :size="14"><component :is="'List'"/></el-icon>错误日志列表</span>
              </div>
              <div class="toolbar-right">
                <span class="card-extra">共 {{ filtered.length }} 条</span>
              </div>
            </div>
            <div class="table-wrap">
              <el-table :data="paged" row-key="id" style="width:100%;">
                <template #empty><div class="empty-state"><el-icon :size="36"><component :is="'FolderOpened'"/></el-icon><div>暂无匹配的错误日志</div></div></template>
                <el-table-column label="模块" width="110">
                  <template #default="{ row }"><span class="tag-module">{{ row.module || '-' }}</span></template>
                </el-table-column>
                <el-table-column label="消息" min-width="240" show-overflow-tooltip>
                  <template #default="{ row }"><div class="msg-text" :title="row.message">{{ row.message || '-' }}</div></template>
                </el-table-column>
                <el-table-column label="次数" width="70" align="center">
                  <template #default="{ row }"><span style="font-weight:700;font-family:monospace;color:var(--text-primary);">{{ row.count }}</span></template>
                </el-table-column>
                <el-table-column label="首次出现" width="160">
                  <template #default="{ row }"><span style="font-size:13px;color:var(--text-secondary);">{{ row.first_seen }}</span></template>
                </el-table-column>
                <el-table-column label="最近出现" width="160">
                  <template #default="{ row }"><span style="font-size:13px;color:var(--text-secondary);">{{ row.last_seen }}</span></template>
                </el-table-column>
                <el-table-column label="操作" width="100" fixed="right">
                  <template #default="{ row }">
                    <div class="row-actions">
                      <el-button size="small" @click="openDetail(row)"><el-icon :size="12" style="margin-right:3px;"><component :is="'View'"/></el-icon> 详情</el-button>
                    </div>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <!-- 分页 -->
            <el-pagination
              background
              layout="prev, pager, next, total"
              :total="filtered.length"
              :page-size="pageSize"
              :current-page="page"
              @current-change="goPage">
            </el-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" v-show="detail.show" @click.self="detail.show = false">
    <div class="modal modal-extra">
      <div class="modal-header">
        <span class="modal-title"><span class="modal-icon icon-blue"><el-icon :size="14"><component :is="'Document'"/></el-icon></span>日志详情</span>
        <button class="modal-close" @click="detail.show = false"><el-icon><component :is="'Close'"/></el-icon></button>
      </div>
      <div class="modal-body">
        <template v-if="detail.row">
          <div class="detail-meta">
            <span class="tag" :class="levelTag(detail.row.level)">{{ levelLabel(detail.row.level) }}</span>
            <span class="tag-module">{{ detail.row.module || '-' }}</span>
            <span class="detail-time"><el-icon :size="12"><component :is="'Clock'"/></el-icon> {{ detail.row.first_seen }}</span>
          </div>
          <dl class="detail-list">
            <div><dt>等级</dt><dd><span class="tag" :class="levelTag(detail.row.level)">{{ levelLabel(detail.row.level) }}</span></dd></div>
            <div><dt>模块</dt><dd><span class="tag-module">{{ detail.row.module || '-' }}</span></dd></div>
            <div class="full"><dt>消息</dt><dd>{{ detail.row.message || '-' }}</dd></div>
            <div><dt>出现次数</dt><dd><span style="font-weight:700;font-size:16px;color:var(--text-primary);">{{ detail.row.count }}</span></dd></div>
            <div><dt>首次出现</dt><dd class="mono">{{ detail.row.first_seen }}</dd></div>
            <div class="full"><dt>最近出现</dt><dd class="mono">{{ detail.row.last_seen }}</dd></div>
          </dl>
          <div class="detail-section"><el-icon :size="13"><component :is="'Tickets'"/></el-icon> 详细数据</div>
          <pre class="json-block">{{ pretty(detail.row.detail) }}</pre>
        </template>
      </div>
      <div class="modal-footer">
        <el-button @click="detail.show = false"><el-icon :size="13" style="margin-right:3px;"><component :is="'Close'"/></el-icon> 关闭</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/ui.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const app = createApp({
  data() {
    return {
      f: { module: '', range: '24h', keyword: '' },
      list: [], page: 1, pageSize: 8,
      detail: { show: false, row: null }
    };
  },
  computed: {
    statTotal() { return this.list.length; },
    statCount() { return this.list.reduce((s, l) => s + (Number(l.count) || 0), 0); },
    statModule() { return new Set(this.list.map(l => l.module).filter(Boolean)).size; },
    filtered() { return this.list; },
    totalPages() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
    pageItems() {
      const tp = this.totalPages, cur = this.page;
      const items = [];
      for (let i = 1; i <= tp; i++) {
        if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) items.push(i);
        else if (items[items.length - 1] !== '...') items.push('...');
      }
      return items;
    },
    paged() {
      const start = (this.page - 1) * this.pageSize;
      return this.filtered.slice(start, start + this.pageSize);
    }
  },
  mounted() {
    ThemeManager.init();
    this.load();
  },
  methods: {
    levelLabel(v) { return App.ui.logLevel(v); },
    levelTag(v) {
      return v === 'error' ? 'tag-danger' : (v === 'warn' ? 'tag-warning' : (v === 'info' ? 'tag-success' : 'tag-other'));
    },
    rangeStart() {
      const h = { '24h': 24, '7d': 168, '30d': 720 }[this.f.range] || 24;
      const d = new Date(Date.now() - h * 3600000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    },
    load() {
      const p = { page: 1, page_size: 100 };
      if (this.f.module) p.module = this.f.module;
      if (this.f.keyword) p.keyword = this.f.keyword;
      if (this.f.range) p.start_time = this.rangeStart();
      App.api.engineLog.list(p).then(({ list }) => {
        this.list = list || [];
        this.page = 1;
      }).catch(() => {});
    },
    reset() {
      this.f = { module: '', range: '24h', keyword: '' };
      this.load();
    },
    goPage(p) { this.page = p; },
    pretty(s) {
      if (!s) return '— 无 —';
      try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; }
    },
    openDetail(row) { this.detail.row = row; this.detail.show = true; }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
