<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爬虫IP库</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <link rel="stylesheet" href="../../static/css/table.css">
  <style>
    /* ============================================================
       爬虫IP库页面样式（对齐白名单页的深浅色体系）
       ============================================================ */
    html, body { height: 100%; }
    #app { height: 100%; }
    .page-container { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; background: var(--content-gradient), var(--bg-body); }
    .page-container::-webkit-scrollbar { width: 6px; }
    .page-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* ===== 统计卡片 ===== */
    .stats-row { margin-bottom: 16px; }
    .stats-row .el-col { margin-bottom: 0; }
    .mini-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; gap: 14px; height: 100%; box-sizing: border-box; }
    .mini-stat .ms-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .mini-stat .ms-label { font-size: 12px; color: var(--text-secondary); }
    .mini-stat .ms-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-primary); }
    .icon-blue { background: var(--accent-soft); color: var(--accent); }
    .icon-green { background: rgba(34,197,94,0.12); color: var(--success); }
    .icon-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
    .icon-orange { background: rgba(245,158,11,0.12); color: var(--warning); }

    /* ===== 说明条 ===== */
    .tip-bar { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; margin-bottom: 16px; border-radius: var(--radius); background: var(--accent-soft); color: var(--text-secondary); font-size: 12px; line-height: 1.7; }
    .tip-bar i { color: var(--accent); margin-top: 2px; }

    /* ===== 列表卡片 ===== */
    .list-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 10px; }

    /* ===== 表格内标签配色 ===== */
    .el-tag .ms-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .el-tag.tag-ip { background: rgba(47,123,246,0.12) !important; color: var(--accent) !important; border: none !important; }

    /* ===== 表格工具类 ===== */
    .mono { font-family: "SF Mono", Consolas, monospace; color: var(--text-primary); }
    .text-muted { color: var(--text-muted); }
    .row-actions { display: inline-flex; gap: 6px; }
    .row-actions .el-button + .el-button { margin-left: 0; }

    /* ============================================================
       深浅色兜底（即使 element-reset 未加载也保证输入框/下拉框不显白底）
       ============================================================ */
    .el-input__wrapper { background-color: var(--bg-card) !important; box-shadow: 0 0 0 1px var(--border) inset !important; }
    .el-input__wrapper.is-focus { box-shadow: 0 0 0 1px var(--accent) inset !important; }
    .el-input__inner { color: var(--text-primary) !important; }
    .el-button--default { background-color: transparent !important; border-color: var(--border) !important; color: var(--text-secondary) !important; }
    .el-button--default:hover { background-color: transparent !important; border-color: var(--accent) !important; color: var(--accent) !important; }
    .el-button--primary { background-color: var(--accent) !important; border-color: var(--accent) !important; color: #fff !important; }
    .el-button--danger { background-color: rgba(239,68,68,0.12) !important; border-color: transparent !important; color: var(--danger) !important; }
    .el-pagination button, .el-pagination .el-pager li { background-color: var(--bg-card) !important; border: 1px solid var(--border); color: var(--text-secondary) !important; }
    .el-pagination .el-pager li.is-active { background-color: var(--accent) !important; color: #fff !important; border-color: var(--accent); }

    @media (max-width: 768px) {
      .page-container { padding: 14px; }
      .stats-row .el-col { margin-bottom: 10px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar-right { justify-content: flex-start; }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="page-container">
    <!-- ===== 统计卡片 ===== -->
    <el-row :gutter="16" class="stats-row">
      <el-col :xs="12" :sm="12" :md="6" v-for="s in statCards" :key="s.key">
        <div class="mini-stat">
          <div class="ms-icon" :class="s.iconClass"><i :class="'fa-solid ' + s.icon"></i></div>
          <div>
            <div class="ms-label">{{ s.label }}</div>
            <div class="ms-value">{{ s.value }}</div>
          </div>
        </div>
      </el-col>
    </el-row>

    <!-- ===== 云平台上报状态（引擎上报器经 Redis 状态键上报快照；30min 未刷新视为离线） ===== -->
    <div class="tip-bar">
      <i class="fa-solid fa-cloud-arrow-up" :style="{ color: reportStatus && reportStatus.last_flush_at ? 'var(--success)' : 'var(--text-muted)' }"></i>
      <div>
        <template v-if="reportStatus && reportStatus.last_flush_at">
          云平台上报运行中：最近批量 <b>{{ reportStatus.last_flush_at }}</b> 上报 {{ reportStatus.last_batch }} 条，当前缓冲 {{ reportStatus.queue_len }} 条<template v-if="reportStatus.buffer_oldest">（最早 {{ reportStatus.buffer_oldest }}）</template>；每 10 分钟批量上报一次，失败缓冲 72 小时重试
        </template>
        <template v-else>云平台上报未运行：未配置 platform_base_url 或引擎上报器离线/从未有可上报数据（配置后每 10 分钟自动批量上报）</template>
      </div>
      <el-button size="small" text @click="loadReportStatus"><i class="fa-solid fa-rotate"></i></el-button>
    </div>

    <!-- ===== 说明 ===== -->
    <div class="tip-bar">
      <i class="fa-solid fa-circle-info"></i>
      <div>多次在无感人机验证中凭证过期的来源 IP 会被程序自动加入本库并拦截；命中后该 IP 的后续请求将直接返回拦截页面。列出的 IP 可手动新增、编辑备注、启停或删除。
        下拉框与开关在深色模式下自适应正常。</div>
    </div>

    <!-- ===== 列表 ===== -->
    <div class="list-card">
      <div class="toolbar">
        <div class="toolbar-left">
          <el-input v-model="keyword" placeholder="搜索IP地址..." clearable style="width:220px" @keyup.enter="search"></el-input>
          <el-select v-model="source" placeholder="来源" clearable style="width:130px">
            <el-option label="后台手动" value="manual"></el-option>
            <el-option label="程序自动" value="expired_challenge"></el-option>
          </el-select>
          <el-select v-model="reason" placeholder="入库原因" clearable style="width:150px">
            <el-option label="Cookie过期" value="cookie_expired"></el-option>
            <el-option label="短期重复验证通过" value="short_interval"></el-option>
            <el-option label="多次验证失败" value="nonce_fail"></el-option>
            <el-option label="短时错误频繁" value="err_freq"></el-option>
            <el-option label="资源请求不完整" value="asset_missing"></el-option>
            <el-option label="失败围栏" value="fail_fence"></el-option>
            <el-option label="无 JS 执行" value="no_js"></el-option>
            <el-option label="指纹头矛盾" value="sec_ch_ua"></el-option>
            <el-option label="后台手动" value="manual"></el-option>
          </el-select>
          <el-button type="primary" @click="search"><i class="fa-solid fa-magnifying-glass"></i> 搜索</el-button>
          <el-button @click="resetSearch"><i class="fa-solid fa-rotate-left"></i> 重置</el-button>
        </div>
        <div class="toolbar-right">
          <el-button @click="openShared"><i class="fa-solid fa-cloud"></i> 平台共享库</el-button>
          <el-button type="primary" @click="openAdd"><i class="fa-solid fa-plus"></i> 新增IP</el-button>
        </div>
      </div>

      <el-table :data="pageData" row-key="id" style="width:100%" empty-text="暂无匹配IP">
        <el-table-column label="ID" width="70" align="center">
          <template #default="{ row }"><span class="text-muted">{{ row.id }}</span></template>
        </el-table-column>
        <el-table-column label="IP地址" min-width="170">
          <template #default="{ row }"><span class="mono">{{ row.ip }}</span></template>
        </el-table-column>
        <el-table-column label="来源" width="130">
          <template #default="{ row }">
            <el-tag :class="row.source === 'manual' ? 'tag-ip' : 'tag-ip'">
              <span class="ms-dot" :style="{ background: row.source === 'manual' ? 'var(--accent)' : 'var(--warning)' }"></span>
              {{ row.source === 'manual' ? '后台手动' : '程序自动' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column label="入库原因" width="150">
          <template #default="{ row }">
            <span class="text-muted">{{ reasonText(row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="备注" min-width="200" show-overflow-tooltip>
          <template #default="{ row }"><span :class="{ 'text-muted': !row.remark }">{{ row.remark || '—' }}</span></template>
        </el-table-column>
        <el-table-column label="状态" width="90" align="center">
          <template #default="{ row }">
            <el-switch :model-value="row.status === 1" @change="v => handleStatusChange(row, v)"></el-switch>
          </template>
        </el-table-column>
        <el-table-column label="创建时间" width="170">
          <template #default="{ row }"><span class="text-muted">{{ row.create_time }}</span></template>
        </el-table-column>
        <el-table-column label="更新时间" width="170">
          <template #default="{ row }"><span class="text-muted">{{ row.update_time }}</span></template>
        </el-table-column>
        <el-table-column label="操作" width="160" fixed="right">
          <template #default="{ row }">
            <div class="row-actions">
              <el-button size="small" @click="openEdit(row)"><i class="fa-solid fa-pen"></i> 编辑</el-button>
              <el-button size="small" type="danger" @click="openDel(row)"><i class="fa-solid fa-trash"></i> 删除</el-button>
            </div>
          </template>
        </el-table-column>
      </el-table>

      <el-pagination
        background
        layout="prev, pager, next, total"
        :total="total"
        :page-size="pageSize"
        :current-page="currentPage"
        @current-change="handlePageChange">
      </el-pagination>
    </div>
  </div>

  <!-- ===== 新增/编辑弹窗 ===== -->
  <el-dialog v-model="dialogVisible" :title="dialogTitle" width="460px" append-to-body :close-on-click-modal="false">
    <el-form :model="form" label-width="70px">
      <el-form-item label="IP地址" required>
        <el-input v-model="form.ip" placeholder="支持 IPv4 / IPv6，例如 1.2.3.4" :disabled="form.id > 0"></el-input>
      </el-form-item>
      <el-form-item label="状态">
        <el-switch v-model="form.status" :active-value="1" :inactive-value="0" active-text="拦截" inactive-text="停用"></el-switch>
      </el-form-item>
      <el-form-item label="备注">
        <el-input v-model="form.remark" type="textarea" :rows="3" placeholder="可选，说明该IP标记来源或用途"></el-input>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="dialogVisible = false">取消</el-button>
      <el-button type="primary" :loading="saving" @click="submit">保存</el-button>
    </template>
  </el-dialog>

  <!-- 平台共享库弹窗（M4：来源 platform 只读物化，本地启停） -->
  <el-dialog v-model="sharedModal.show" title="平台共享库（云平台聚合下发）" width="720px">
    <el-table :data="sharedModal.list" size="small" empty-text="暂无共享库段（平台同步后自动出现）">
      <el-table-column label="IP / IP段">
        <template #default="{ row }">{{ row.start_ip === row.end_ip ? row.start_ip : row.start_ip + ' ~ ' + row.end_ip }}</template>
      </el-table-column>
      <el-table-column prop="first_seen" label="首次发现" width="160"></el-table-column>
      <el-table-column prop="source_count" label="来源实例数" width="100" align="center"></el-table-column>
      <el-table-column label="状态" width="90" align="center">
        <template #default="{ row }">{{ row.status === 1 ? '拦截中' : '已停用' }}</template>
      </el-table-column>
      <el-table-column label="启停" width="80" align="center">
        <template #default="{ row }">
          <el-switch :model-value="row.status === 1" @change="v => toggleShared(row, v)"></el-switch>
        </template>
      </el-table-column>
    </el-table>
  </el-dialog>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const app = createApp({
  data() {
    return {
      rows: [],
      total: 0,
      sharedModal: { show: false, list: [] }, // 平台共享库弹窗（M4：来源 platform 只读物化，本地启停）
      // 库级统计（整库口径，由服务端 /api/crawler_ip/stats 返回，不受筛选/分页影响）
      stats: { total: 0, blocking: 0, manual: 0, auto: 0 },
      // 云平台上报器运行状态（Redis 状态键快照；null=从未上报/离线）
      reportStatus: null,
      currentPage: 1,
      pageSize: 20,
      keyword: '',
      source: '',
      reason: '',
      dialogVisible: false,
      saving: false,
      form: { id: 0, ip: '', status: 1, remark: '' }
    };
  },
  computed: {
    statCards() {
      const s = this.stats;
      return [
        { key: 'blocking', label: '拦截中', value: s.blocking, icon: 'fa-ban', iconClass: 'icon-orange' },
        { key: 'total', label: 'IP总数', value: s.total, icon: 'fa-list', iconClass: 'icon-blue' },
        { key: 'manual', label: '后台手动', value: s.manual, icon: 'fa-hand', iconClass: 'icon-purple' },
        { key: 'auto', label: '程序自动', value: s.auto, icon: 'fa-robot', iconClass: 'icon-green' }
      ];
    },
    dialogTitle() { return this.form.id > 0 ? '编辑IP' : '新增IP'; },
    pageData() { return this.rows; }
  },
  mounted() {
    ThemeManager.init();
    this.load();
    this.loadReportStatus();
    window.onSearch = () => this.load();
  },
  methods: {
    /* 云平台上报器运行状态（引擎 flush 成功后写 Redis；30min TTL，读不到即离线/未运行） */
    loadReportStatus() {
      App.api.crawlerIp.reportStatus().then((st) => { this.reportStatus = st || null; }).catch(() => {});
    },
    /* 平台共享库弹窗（M4）：平台聚合下发的爬虫 IP（本地启停，停用后引擎游标感知不再拦截） */
    openShared() {
      this.sharedModal.show = true;
      /* App.request 仅返回响应的 data 字段（= 行数组本身）；解构 { list } 取不到值导致弹窗恒空 */
      App.request('/api/crawlerIp/shared', { page: 1, page_size: 100 }).then((rows) => {
        this.sharedModal.list = rows || [];
      }).catch(() => {});
    },
    toggleShared(row, on) {
      App.request('/api/crawlerIp/shared_toggle', { id: row.id, status: on ? 1 : 0 }).then(() => {
        row.status = on ? 1 : 0;
        ElementPlus.ElMessage.success(on ? '已启用拦截' : '已停用拦截');
      }).catch(() => {});
    },
    load() {
      App.api.crawlerIp.list(this.currentPage, this.pageSize, this.keyword, this.source, this.reason).then(({ list, count }) => {
        this.rows = (list || []).map(r => ({
          id: r.id, ip: r.ip, remark: r.remark, status: r.status === 1 ? 1 : 0, source: r.source, reason: r.reason || '',
          create_time: r.create_time, update_time: r.update_time
        }));
        this.total = count || 0;
      }).catch(() => {});
      this.loadStats();
    },
    // 库级统计：列表刷新（含新增/启停/删除后的 this.load()）时一并刷新
    loadStats() {
      App.api.crawlerIp.stats().then(s => {
        if (s) this.stats = { total: s.total || 0, blocking: s.blocking || 0, manual: s.manual || 0, auto: s.auto || 0 };
      }).catch(() => {});
    },
    search() { this.currentPage = 1; this.load(); },
    resetSearch() { this.keyword = ''; this.source = ''; this.reason = ''; this.currentPage = 1; this.load(); },
    handlePageChange(page) { this.currentPage = page; this.load(); },
    reasonText(row) {
      const map = {
        'cookie_expired': 'Cookie过期',
        'short_interval': '短期重复验证通过',
        'nonce_fail': '多次验证失败',
        'err_freq': '短时错误频繁',
        'asset_missing': '资源请求不完整',
        'fail_fence': '失败围栏',
        'no_js': '无 JS 执行',
        'sec_ch_ua': '指纹头矛盾',
        'manual': '后台手动',
        '': '早期入库(未记录原因)'
      };
      return map[row.reason] || (row.source === 'manual' ? '后台手动' : '未知原因(' + (row.reason || '空') + ')');
    },
    handleStatusChange(row, v) {
      App.api.crawlerIp.toggle(row.id, v ? 1 : 0).then(() => {
        row.status = v ? 1 : 0;
        ElementPlus.ElMessage({ message: row.ip + ' 已' + (v ? '启用拦截' : '停用'), type: v ? 'success' : 'warning', duration: 2000 });
      }).catch(() => {});
    },
    openAdd() {
      this.form = { id: 0, ip: '', status: 1, remark: '' };
      this.dialogVisible = true;
    },
    openEdit(row) {
      this.form = { id: row.id, ip: row.ip, status: row.status, remark: row.remark || '' };
      this.dialogVisible = true;
    },
    submit() {
      if (this.form.id <= 0 && !this.form.ip.trim()) {
        ElementPlus.ElMessage.warning('请填写IP地址');
        return;
      }
      this.saving = true;
      App.api.crawlerIp.save({
        id: this.form.id, ip: this.form.ip.trim(), status: this.form.status, remark: this.form.remark
      }).then(() => {
        ElementPlus.ElMessage({ message: '保存成功', type: 'success', duration: 2000 });
        this.dialogVisible = false;
        this.currentPage = 1;
        this.load();
      }).finally(() => { this.saving = false; });
    },
    openDel(row) {
      const h = Vue.h;
      ElementPlus.ElMessageBox({
        title: '删除确认',
        message: h('div', null, [
          h('p', null, ['确定要从爬虫IP库移除 ', h('span', { class: 'mbx-highlight' }, row.ip), ' 吗？']),
          h('p', null, '移除后该 IP 将解除自动拦截，可正常访问。')
        ]),
        showCancelButton: true,
        confirmButtonText: '确认删除',
        cancelButtonText: '取消',
        confirmButtonType: 'danger',
        cancelButtonType: 'default',
        customClass: 'mb-del',
        autofocus: false,
        closeOnClickModal: false
      }).then(() => App.api.crawlerIp.remove(row.id))
        .then(() => {
          ElementPlus.ElMessage({ message: '已移除', type: 'success', duration: 2000 });
          this.load();
        }).catch(() => {});
    }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
