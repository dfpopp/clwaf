<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>审计日志</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <style>
    /* ===== 弹窗 ===== */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 520px; max-width: 92%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal.modal-extra { width: 680px; }
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .modal-title .modal-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .modal-icon.icon-primary { background: var(--accent-soft); color: var(--accent); }
    .modal-icon.icon-blue { background: var(--accent-soft); color: var(--accent); }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px; }
    .modal-close:hover { color: var(--text-primary); }
    .modal-body { padding: 18px 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; border-top: 1px solid var(--border); }

    /* 筛选栏 */
    .filter-bar { flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 6px; }
    .filter-group .select { min-width: 150px; }
    .filter-group .search-box input { width: 160px; }

    /* 操作类型标签扩展色 */
    .tag-teal { background: rgba(20,184,166,0.12); color: #2dd4bf; }
    .tag-cyan { background: rgba(6,182,212,0.12); color: #22d3ee; }

    /* 摘要列截断 */
    td .summary-text { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-actions { display: inline-flex; gap: 6px; }

    /* 详情弹窗 */
    .detail-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .detail-time { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .detail-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; margin-bottom: 16px; }
    .detail-list > div { display: flex; flex-direction: column; gap: 3px; }
    .detail-list > div.full { grid-column: 1 / -1; }
    .detail-list dt { font-size: 11px; color: var(--text-muted); }
    .detail-list dd { font-size: 13px; color: var(--text-primary); word-break: break-all; }
    .detail-section { font-size: 12px; color: var(--text-secondary); margin: 4px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .detail-section.before .sec-icon { color: var(--warning); }
    .detail-section.after .sec-icon { color: var(--success); }

    /* JSON 数据块 */
    .json-block { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-family: "SF Mono", Consolas, monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow-y: auto; line-height: 1.5; margin-bottom: 16px; }
    .json-block.before { background: rgba(245,158,11,0.08); color: #d97706; }
    .json-block.after { background: rgba(34,197,94,0.08); color: #16a34a; }
    .json-block::-webkit-scrollbar { width: 5px; }
    .json-block::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .json-empty { color: var(--text-muted); font-style: italic; padding: 10px 0; }

    @media (max-width: 768px) { .detail-list { grid-template-columns: 1fr; } .modal.modal-extra { width: 100%; } }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="layout">
    <div class="main">
      <div class="content">
        <!-- 统计卡片 -->
        <div class="stat-grid cols-3">
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">今日操作总数</span>
              <span class="stat-icon icon-blue"><el-icon :size="15"><component :is="'Memo'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statTotal }}</div>
            <div class="stat-change">当前查询条件范围内</div>
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">规则变更次数</span>
              <span class="stat-icon icon-orange"><el-icon :size="15"><component :is="'Tickets'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statRule }}</div>
            <div class="stat-change">规则相关变更（白名单/CC/自定义/IP组）</div>
          </div>
          <div class="stat-card">
            <div class="stat-top">
              <span class="stat-label">站点变更次数</span>
              <span class="stat-icon icon-green"><el-icon :size="15"><component :is="'Monitor'"/></el-icon></span>
            </div>
            <div class="stat-value">{{ statSite }}</div>
            <div class="stat-change">站点相关变更</div>
          </div>
        </div>

        <!-- 筛选栏 -->
        <div class="section-title">操作记录 <span class="sub">记录所有管理员的操作行为</span></div>
        <div class="filter-bar">
          <div class="filter-left">
            <div class="filter-group">
              <label class="filter-label"><el-icon :size="14"><component :is="'List'"/></el-icon>操作类型</label>
              <el-select v-model="f.action" placeholder="全部类型" clearable @change="onActionChange" style="width:130px;">
                <el-option v-for="o in actionOptions" :key="o.value" :value="o.value" :label="o.label"></el-option>
              </el-select>
            </div>
            <div class="filter-group">
              <label class="filter-label"><el-icon :size="14"><component :is="'Grid'"/></el-icon>模块</label>
              <el-select v-model="f.module" placeholder="全部模块" clearable @change="load" style="width:130px;">
                <el-option v-for="o in moduleOptions" :key="o.value" :value="o.value" :label="o.label"></el-option>
              </el-select>
            </div>
            <div class="filter-group">
              <label class="filter-label"><el-icon :size="14"><component :is="'Clock'"/></el-icon>时间范围</label>
              <el-select v-model="f.range" @change="load" style="width:130px;">
                <el-option value="24h" label="近24小时"></el-option>
                <el-option value="7d" label="近7天"></el-option>
                <el-option value="30d" label="近30天"></el-option>
              </el-select>
            </div>
            <div class="filter-group">
              <el-input v-model="f.operator_name" placeholder="搜索操作人..." style="width:180px;" @keyup.enter="load">
                <template #prefix><el-icon :size="14"><component :is="'Search'"/></el-icon></template>
              </el-input>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <el-button @click="reset"><el-icon :size="13"><component :is="'RefreshLeft'"/></el-icon> 重置</el-button>
            <el-button type="primary" @click="load"><el-icon :size="13"><component :is="'Search'"/></el-icon> 查询</el-button>
          </div>
        </div>

        <!-- 日志表格 -->
        <div class="card">
          <div class="card-body" style="padding:0;">
            <div class="toolbar" style="margin-bottom:0;padding:14px 16px;border-bottom:1px solid var(--border);">
              <div class="toolbar-left">
                <span class="filter-label"><el-icon :size="14"><component :is="'Clock'"/></el-icon>操作记录</span>
              </div>
              <div class="toolbar-right">
                <el-button @click="exportCsv"><el-icon :size="13"><component :is="'Download'"/></el-icon> 导出CSV</el-button>
              </div>
            </div>
            <div class="table-wrap">
              <el-table :data="paged" row-key="id" style="width:100%;">
                <template #empty><div class="empty-state"><el-icon :size="36"><component :is="'FolderOpened'"/></el-icon><div>暂无匹配的审计日志</div></div></template>
                <el-table-column label="时间" min-width="160">
                  <template #default="{ row }"><span style="color:var(--text-muted);">{{ row.create_time }}</span></template>
                </el-table-column>
                <el-table-column label="操作人" min-width="110">
                  <template #default="{ row }"><span class="mono" style="color:var(--text-primary);">{{ row.operator_name || '-' }}</span></template>
                </el-table-column>
                <el-table-column label="模块" min-width="100">
                  <template #default="{ row }">{{ moduleLabel(row.module) }}</template>
                </el-table-column>
                <el-table-column label="操作类型" min-width="100">
                  <template #default="{ row }"><span class="tag" :class="actionTag(row.action)">{{ actionLabel(row.action) }}</span></template>
                </el-table-column>
                <el-table-column label="操作内容摘要" min-width="240" show-overflow-tooltip>
                  <template #default="{ row }"><span class="summary-text" :title="summary(row)">{{ summary(row) }}</span></template>
                </el-table-column>
                <el-table-column label="IP地址" min-width="130">
                  <template #default="{ row }"><span class="mono" style="color:var(--text-primary);">{{ row.ip || '-' }}</span></template>
                </el-table-column>
                <el-table-column label="操作" width="100" fixed="right">
                  <template #default="{ row }">
                    <div class="row-actions">
                      <el-button size="small" @click="openDetail(row)"><el-icon :size="12" style="margin-right:3px;"><component :is="'View'"/></el-icon> 详情</el-button>
                    </div>
                  </template>
                </el-table-column>
              </el-table>
            </div>
            <!-- 分页 -->
            <el-pagination
              background
              layout="prev, pager, next, total"
              :total="filtered.length"
              :page-size="pageSize"
              :current-page="page"
              @current-change="goPage">
            </el-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-mask" v-show="detail.show" @click.self="detail.show = false">
    <div class="modal modal-extra">
      <div class="modal-header">
        <span class="modal-title"><span class="modal-icon icon-blue"><el-icon :size="14"><component :is="'Document'"/></el-icon></span>操作详情</span>
        <button class="modal-close" @click="detail.show = false"><el-icon><component :is="'Close'"/></el-icon></button>
      </div>
      <div class="modal-body">
        <template v-if="detail.row">
          <div class="detail-meta">
            <span class="tag" :class="actionTag(detail.row.action)">{{ actionLabel(detail.row.action) }}</span>
            <span class="detail-time"><el-icon :size="12"><component :is="'Clock'"/></el-icon> {{ detail.row.create_time }}</span>
          </div>
          <dl class="detail-list">
            <div><dt>操作人</dt><dd>{{ detail.row.operator_name || '-' }}</dd></div>
            <div><dt>IP 地址</dt><dd class="mono">{{ detail.row.ip || '-' }}</dd></div>
            <div><dt>模块</dt><dd>{{ moduleLabel(detail.row.module) }}</dd></div>
            <div><dt>操作类型</dt><dd><span class="tag" :class="actionTag(detail.row.action)">{{ actionLabel(detail.row.action) }}</span></dd></div>
            <div><dt>请求ID</dt><dd class="mono">{{ detail.row.req_id || '-' }}</dd></div>
            <div><dt>目标ID</dt><dd class="mono">{{ detail.row.target_id || '-' }}</dd></div>
            <div class="full"><dt>操作摘要</dt><dd>{{ summary(detail.row) }}</dd></div>
          </dl>
          <div class="detail-section before"><el-icon class="sec-icon" :size="13"><component :is="'Back'"/></el-icon> 变更前数据</div>
          <pre class="json-block before" :class="{ 'json-empty': !pretty(detail.row.before_data) }">{{ pretty(detail.row.before_data) || '— 无变更前数据 —' }}</pre>
          <div class="detail-section after"><el-icon class="sec-icon" :size="13"><component :is="'Right'"/></el-icon> 变更后数据</div>
          <pre class="json-block after" :class="{ 'json-empty': !pretty(detail.row.after_data) }">{{ pretty(detail.row.after_data) || '— 无变更后数据 —' }}</pre>
        </template>
      </div>
      <div class="modal-footer">
        <el-button @click="detail.show = false"><el-icon :size="13" style="margin-right:3px;"><component :is="'Close'"/></el-icon> 关闭</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/ui.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const RULE_MODULES = ['whitelist', 'cc', 'custom_rule', 'ip_group'];
const app = createApp({
  data() {
    return {
      f: { module: '', action: '', operator_name: '', range: '24h' },
      moduleOptions: App.ui.auditModuleOptions(),
      actionOptions: App.ui.auditActionOptions(),
      list: [], page: 1, pageSize: 8,
      detail: { show: false, row: null }
    };
  },
  computed: {
    statTotal() { return this.filtered.length; },
    statRule() { return this.filtered.filter(r => RULE_MODULES.includes(r.module)).length; },
    statSite() { return this.filtered.filter(r => r.module === 'site').length; },
    filtered() {
      const act = this.f.action;
      if (!act) return this.list;
      return this.list.filter(r => r.action === act);
    },
    totalPages() { return Math.max(1, Math.ceil(this.filtered.length / this.pageSize)); },
    pageItems() {
      const tp = this.totalPages, cur = this.page;
      const items = [];
      for (let i = 1; i <= tp; i++) {
        if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) items.push(i);
        else if (items[items.length - 1] !== '...') items.push('...');
      }
      return items;
    },
    paged() {
      const start = (this.page - 1) * this.pageSize;
      return this.filtered.slice(start, start + this.pageSize);
    }
  },
  mounted() {
    ThemeManager.init();
    this.load();
  },
  methods: {
    moduleLabel(v) { return App.ui.auditModuleLabel(v); },
    actionLabel(v) { return App.ui.auditActionLabel(v); },
    actionTag(v) {
      return {
        create: 'tag-custom', update: 'tag-warning', delete: 'tag-danger',
        import: 'tag-teal', sort: 'tag-cyan', login: 'tag-success',
        logout: 'tag-other', switch: 'tag-warning', clean: 'tag-danger'
      }[v] || 'tag-other';
    },
    rangeStart() {
      const h = { '24h': 24, '7d': 168, '30d': 720 }[this.f.range] || 24;
      const d = new Date(Date.now() - h * 3600000);
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    },
    load() {
      const p = { page: 1, page_size: 100 };
      if (this.f.module) p.module = this.f.module;
      if (this.f.operator_name) p.operator_name = this.f.operator_name;
      if (this.f.range) p.start_time = this.rangeStart();
      App.api.auditLog.list(p).then(({ list }) => {
        this.list = list || [];
        this.page = 1;
      }).catch(() => {});
    },
    reset() {
      this.f = { module: '', action: '', operator_name: '', range: '24h' };
      this.load();
    },
    onActionChange() { this.page = 1; },
    goPage(p) { this.page = p; },
    summary(row) {
      let s = '';
      if (row.after_data) {
        try {
          const d = JSON.parse(row.after_data);
          s = d && d.name ? ('修改了「' + d.name + '」的配置') : ('变更了 ' + App.ui.auditModuleLabel(row.module) + ' 的配置');
        } catch (e) {
          s = '变更了 ' + App.ui.auditModuleLabel(row.module) + ' 的配置';
        }
      } else if (row.before_data) {
        try {
          const d = JSON.parse(row.before_data);
          s = d && d.name ? ('删除了「' + d.name + '」') : ('删除 ' + App.ui.auditModuleLabel(row.module) + ' 记录');
        } catch (e) {
          s = '删除操作';
        }
      }
      if (!s && row.target_id) s = '目标ID: ' + row.target_id;
      return s || '-';
    },
    pretty(s) {
      if (!s) return '';
      try { return JSON.stringify(JSON.parse(s), null, 2); } catch (e) { return s; }
    },
    openDetail(row) { this.detail.row = row; this.detail.show = true; },
    exportCsv() {
      const rows = this.filtered.map(r => [
        r.create_time, r.operator_name || '', App.ui.auditModuleLabel(r.module),
        App.ui.auditActionLabel(r.action), this.summary(r), r.ip || ''
      ]);
      App.ui.downloadCsv('audit_log.csv', ['时间', '操作人', '模块', '操作类型', '操作内容摘要', 'IP地址'], rows);
    }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
