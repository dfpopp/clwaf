<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>站点管理</title>
  <script>
    (function () {
      try {
        var cfg = JSON.parse(localStorage.getItem('admin_theme_config') || 'null');
        document.documentElement.setAttribute('data-theme', (cfg && cfg.theme) || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="../../static/css/reset.css">
  <link rel="stylesheet" href="../../static/css/common.css">
  <link rel="stylesheet" href="../../static/lib/element-plus/index.css">
  <link rel="stylesheet" href="../../static/lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="../../static/css/element-reset.css">
  <style>
    /* ============================================================
       站点管理页面样式（1:1 对齐 UI/site）
       ============================================================ */
    html, body { height: 100%; }
    #app { height: 100%; }
    .page-container { height: 100%; overflow-y: auto; padding: 20px; box-sizing: border-box; background: var(--content-gradient), var(--bg-body); }
    .page-container::-webkit-scrollbar { width: 6px; }
    .page-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* 删除确认弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); width: 380px; max-width: 90%; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal-header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .modal-icon { width: 34px; height: 34px; border-radius: 8px; background: rgba(239,68,68,0.12); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .modal-title { font-size: 14px; font-weight: 600; }
    .modal-body { padding: 18px 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .modal-body .site-name { color: var(--text-primary); font-weight: 600; font-family: "SF Mono", Consolas, monospace; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 18px; }

    /* 操作按钮组 */
    .row-actions { display: inline-flex; gap: 6px; }
    /* SSL 灰色标签 */
    .tag-gray { background: rgba(100,116,139,0.15); color: var(--text-muted); }
    /* 表格内开关垂直对齐 */
    td .switch { vertical-align: middle; }
    /* 状态点 */
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--text-muted); }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="page-container">
    <!-- 统计卡片 -->
    <div class="stat-grid cols-4">
      <div class="stat-card">
        <div class="stat-top"><span class="stat-label">总站点数</span><span class="stat-icon icon-blue"><i class="fa-solid fa-server"></i></span></div>
        <div class="stat-value">{{ statTotal }}</div>
        <div class="stat-change">已接入防护</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><span class="stat-label">在线站点</span><span class="stat-icon icon-green"><i class="fa-solid fa-circle-check"></i></span></div>
        <div class="stat-value">{{ statOnline }}</div>
        <div class="stat-change">运行正常</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><span class="stat-label">离线站点</span><span class="stat-icon icon-red"><i class="fa-solid fa-circle-xmark"></i></span></div>
        <div class="stat-value">{{ statOffline }}</div>
        <div class="stat-change">需检查</div>
      </div>
      <div class="stat-card">
        <div class="stat-top"><span class="stat-label">今日总请求</span><span class="stat-icon icon-purple"><i class="fa-solid fa-arrow-right-arrow-left"></i></span></div>
        <div class="stat-value">{{ statRequests }}</div>
        <div class="stat-change">较昨日</div>
      </div>
    </div>

    <!-- 站点列表 -->
    <div class="section-title">站点列表<span class="sub">Site List</span></div>
    <div class="card">
      <div class="card-body" style="padding:0;">
        <!-- 工具栏 -->
        <div class="toolbar" style="margin-bottom:0;padding:14px 16px;border-bottom:1px solid var(--border);">
          <div class="toolbar-left">
            <el-input v-model="keyword" placeholder="按域名搜索..." clearable style="width:220px" @input="onSearch">
              <template #prefix><i class="fa-solid fa-magnifying-glass"></i></template>
            </el-input>
          </div>
          <div class="toolbar-right">
            <el-button type="primary" @click="goEdit()" :disabled="quotaReached" :title="quotaReached ? quotaTip : ''"><i class="fa-solid fa-plus"></i> 新增站点</el-button>
          </div>
        </div>
        <!-- 表格 -->
        <div class="table-wrap">
          <el-table :data="paged" style="width:100%">
            <el-table-column label="站点名称" min-width="150">
              <template #default="{ row }">
                <span class="status-dot" :class="row.status === 1 ? 'online' : 'offline'"></span>
                <span class="mono">{{ row.name }}</span>
              </template>
            </el-table-column>
            <el-table-column label="域名" min-width="150">
              <template #default="{ row }"><span class="mono">{{ primaryDomain(row.domains) }}</span></template>
            </el-table-column>
            <el-table-column label="监听端口" width="90">
              <template #default="{ row }">{{ row.listen_port }}</template>
            </el-table-column>
            <el-table-column label="源站地址" min-width="150">
              <template #default="{ row }"><span class="mono">{{ primaryUpstream(row.upstreams) }}</span></template>
            </el-table-column>
            <el-table-column label="SSL" width="90">
              <template #default="{ row }">
                <span v-if="row.ssl_enabled === 1" class="tag tag-success">已启用</span>
                <span v-else class="tag tag-gray">未启用</span>
              </template>
            </el-table-column>
            <el-table-column label="防护状态" width="90" align="center">
              <template #default="{ row }">
                <el-switch :model-value="row.waf_enable === 1" @change="v => toggleWaf(row, { target: { checked: v } })"></el-switch>
              </template>
            </el-table-column>
            <el-table-column label="请求数（今日）" width="120">
              <template #default="{ row }">{{ fmtReq(row.today_req_count) }}</template>
            </el-table-column>
            <el-table-column label="最后检查时间" width="170">
              <template #default="{ row }"><span style="color:var(--text-muted)">{{ row.update_time || '-' }}</span></template>
            </el-table-column>
            <el-table-column label="操作" width="160" fixed="right">
              <template #default="{ row }">
                <div class="row-actions">
                  <el-button size="small" @click="goEdit(row.id)"><i class="fa-solid fa-pen"></i> 编辑</el-button>
                  <el-button size="small" type="danger" @click="openDel(row)"><i class="fa-solid fa-trash"></i> 删除</el-button>
                </div>
              </template>
            </el-table-column>
            <template #empty>
              <div class="empty-state"><i class="fa-solid fa-folder-open"></i><div>暂无匹配站点</div></div>
            </template>
          </el-table>
        </div>
        <!-- 分页 -->
        <el-pagination
          background
          layout="prev, pager, next, total"
          :total="total"
          :page-size="pageSize"
          :current-page="page"
          @current-change="goPage">
        </el-pagination>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-mask" v-show="delModal.show" @click.self="closeDelModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <span class="modal-title">删除确认</span>
      </div>
      <div class="modal-body">确定要删除站点 <span class="site-name">{{ delModal.name }}</span> 吗？<br>删除后该站点的所有防护配置将不可恢复。</div>
      <div class="modal-footer">
        <el-button @click="closeDelModal">取消</el-button>
        <el-button type="danger" @click="confirmDel"><i class="fa-solid fa-trash"></i> 确认删除</el-button>
      </div>
    </div>
  </div>
</div>

<script src="../../static/js/config/theme.js"></script>
<script src="../../static/js/config/locale.js"></script>
<script src="../../static/lib/vue.min.js"></script>
<script src="../../static/lib/element-plus/index.js"></script>
<script src="../../static/lib/element-plus-icons/index.js"></script>
<script src="../../static/js/api.js"></script>
<script src="../../static/js/ui.js"></script>
<script src="../../static/js/common.js"></script>
<script>
const { createApp } = Vue;
const app = createApp({
  data() {
    return {
      list: [], keyword: '', page: 1, pageSize: 5,
      maxSites: 0, // 站点数上限（0=不限，/api/system/info capabilities 驱动）
      delModal: { show: false, id: null, name: '' }
    };
  },
  computed: {
    /* 免费版站点数配额：达上限时新增置灰并给升级提示（后端 Save 校验兜底） */
    quotaReached() { return this.maxSites > 0 && this.list.length >= this.maxSites; },
    quotaTip() { return '站点数量已达上限（' + this.maxSites + ' 个），升级 Pro 解锁不限量站点'; },
    statTotal() { return this.list.length; },
    statOnline() { return this.list.filter(s => s.status === 1).length; },
    statOffline() { return this.list.filter(s => s.status !== 1).length; },
    statRequests() { return this.list.reduce((sum, s) => sum + (parseInt(s.today_req_count, 10) || 0), 0).toLocaleString(); },
    filtered() {
      const k = this.keyword.trim().toLowerCase();
      if (!k) return this.list;
      return this.list.filter(s => (s.name || '').toLowerCase().includes(k) || (s.domains || '').toLowerCase().includes(k));
    },
    total() { return this.filtered.length; },
    totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
    pageItems() {
      const tp = this.totalPages, cur = this.page;
      const items = [];
      for (let i = 1; i <= tp; i++) {
        if (i === 1 || i === tp || (i >= cur - 2 && i <= cur + 2)) items.push(i);
        else if (i === cur - 3 || i === cur + 3) items.push('...');
      }
      return items;
    },
    paged() {
      const start = (this.page - 1) * this.pageSize;
      return this.filtered.slice(start, start + this.pageSize);
    }
  },
  watch: {
    'filtered.length'() {
      if (this.page > this.totalPages) this.page = 1;
    }
  },
  mounted() {
    ThemeManager.init();
    App.loadInfo().then((info) => {
      const caps = (info && info.capabilities) || {};
      this.maxSites = Number(caps.max_sites) || 0;
    });
    this.load();
    window.onSearch = () => this.load();
  },
  methods: {
    load() {
      App.api.site.list(1, 10000).then(({ list }) => { this.list = list || []; }).catch(() => {});
    },
    onSearch() { this.page = 1; },
    goPage(p) { this.page = p; },
    fmtReq(v) { return (parseInt(v, 10) || 0).toLocaleString(); },
    primaryDomain(domains) {
      const arr = (domains || '').split(',').map(s => s.trim()).filter(Boolean);
      return arr.length ? arr[0] : '-';
    },
    primaryUpstream(str) {
      try {
        const arr = JSON.parse(str || '[]');
        if (Array.isArray(arr) && arr.length && arr[0].addr) return arr[0].addr;
      } catch (e) {}
      return '-';
    },
    toggleWaf(s, e) {
      const v = e.target.checked ? 1 : 0;
      App.api.site.save({
        id: s.id, name: s.name, domains: s.domains, listen_port: s.listen_port,
        upstreams: s.upstreams, ssl_enabled: s.ssl_enabled, cert_path: s.cert_path, key_path: s.key_path,
        status: s.status, log_enable: s.log_enable, waf_enable: v,
        defense_type: s.defense_type, challenge_template: s.challenge_template
      }).then(() => {
        s.waf_enable = v;
        ElementPlus.ElMessage.success(`站点 ${s.name} 防护已${v === 1 ? '开启' : '关闭'}`);
      }).catch(() => {});
    },
    goEdit(id) {
      window.location.href = id ? '/site/edit.html?id=' + id : '/site/edit.html';
    },
    openDel(s) { this.delModal = { show: true, id: s.id, name: s.name }; },
    closeDelModal() { this.delModal.show = false; },
    confirmDel() {
      App.api.site.remove(this.delModal.id).then(() => {
        ElementPlus.ElMessage.success('站点已删除');
        this.delModal.show = false;
        this.load();
      }).catch(() => {});
    }
  }
});
for (const [name, comp] of Object.entries(ElementPlusIconsVue)) app.component(name, comp);
app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
app.mount('#app');
</script>
</body>
</html>
